<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile 440x280</title>
<!-- Chrome Web Store small promo tile (REQUIRED: "You must provide one small, 440x280-pixel promotional image",
     developer.chrome.com/docs/webstore/images). Rendered by tools/make_graphics.py into
     store-assets/promo/small-promo-440x280.png at exactly 440x280, device scale factor 1, opaque. -->
<link rel="stylesheet" href="promo.css">
<style>
  .tile { display: flex; align-items: center; padding: 0 30px 18px 22px; }
  .icon { width: 136px; height: 136px; flex: 0 0 auto; margin-right: 8px; }
  .text { flex: 1 1 auto; }
  .name { font-size: 40px; }
  .name .for { font-size: 25px; margin-top: 4px; }
  .tagline { font-size: 15px; margin-top: 16px; line-height: 1.35; }
  .tagline span { display: flex; align-items: center; }
  .bullet { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 8px; flex: 0 0 auto; }
  .disclaimer { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11.5px; }
</style>
</head>
<body>
<div class="tile">
  <img class="icon" src="icon-128.svg" alt="">
  <div class="text">
    <div class="name" data-fit="name">Multi-Add<span class="for">for Cronometer</span></div>
    <div class="tagline" data-fit="tagline"><span>Faster diary logging:</span><span><i class="bullet"></i>a whole meal at once</span><span><i class="bullet"></i>adaptive TDEE from your log</span></div>
  </div>
  <div class="disclaimer" data-fit="disclaimer">Unofficial &mdash; not affiliated with Cronometer</div>
</div>
</body>
</html>
