  S.resetCalls();

  function dayView(d) {
    const o = S.overrides[d.date];

    else if (o === false) { excluded = false; }

<script>
(async function () {
  const { describe, it, ok, eq, deepEq } = CMA.test;
  const P = CMA.panel, S = window.__tdee, V = CMA.tdeeView;
  const q = (sel) => P.root.querySelector(sel);

  const text = (el) => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  function waitFor(fn, label, timeout) {
    const t0 = Date.now();
    return new Promise((resolve, reject) => {
      (function poll() {
        let v = null;
        try { v = fn(); } catch (e) { return reject(e); }
        if (v) return resolve(v);
        if (Date.now() - t0 > (timeout || 3000)) return reject(new Error('timed out waiting for ' + label));
        setTimeout(poll, 10);
      })();
    });
  }
  const button = (label, scope) => Array.from((scope || P.root).querySelectorAll('button')).find(b => text(b) === label) || null;
  const iso = (y, m, d) => y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
  function addDaysIso(s, n) { return new Date(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) + n * 86400000).toISOString().slice(0, 10); }
  // A noise-free person (the upstream tests' clean() anchored at "today"): distinctive numbers so the diagnostics
  // test can prove none of them leaks (weight 83.17 kg, intake 2517, Cronometer burned 2653).
  function person(o) {
    const n = o.n, end = o.end || S.today, startKg = o.startKg == null ? 83.17 : o.startKg, tdee = o.tdee == null ? 2517 : o.tdee;
    const intake = o.intake == null ? tdee : o.intake, burned = o.burned == null ? 2653 : o.burned;
    const logFood = o.logFood || (() => true), weigh = o.weigh || (() => true);
    const out = []; let W = startKg;
    for (let t = 0; t < n; t++) {
      const I = typeof intake === 'function' ? intake(t) : intake;
      const logged = logFood(t);
      out.push({ date: addDaysIso(end, t - (n - 1)), intakeKcal: logged ? I : null, weightKg: weigh(t) ? Math.round(W * 100) / 100 : null,
        burnedKcal: burned, burnedParts: { bmr: 1720, activity: burned - 1720, exercise: 0, tef: 0 }, complete: false, loggedFood: logged, partialSuspect: false, source: 'rpc' });
      W += (I - tdee) / 7700;
    }
    return out;
  }
  function scenario(days, opts) {
    const o = opts || {};
    S.raw = days; S.overrides = {};
    if (!o.keepCheckins) S.checkins = [];
    S.emit('data');
  }
  async function openTdee() {
    P.open('tdee');
    await waitFor(() => q('.cma-tdee') && !q('.cma-tdee-loading'), 'the TDEE view rendered');
  }
  async function rendered(pred, label) { return waitFor(() => { try { return pred(); } catch (e) { return false; } }, label, 3000); }
  async function sub(name) {
    const b = qa('.cma-tdee-seg').find(x => x.dataset.sub === name);
    b.click();
    await rendered(() => qa('.cma-tdee-seg').find(x => x.dataset.sub === name).getAttribute('aria-pressed') === 'true', 'sub-view ' + name);
  }
  const chip = () => text(q('.cma-tdee-chip'));
  const model = () => V.model();

  // ---- engine: generated wrapper > vendored module converted here > minimal stub ----
  function xhrText(url) {
    return new Promise((resolve) => {
      try {
        const x = new XMLHttpRequest();
        x.open('GET', url);
        x.addEventListener('loadend', () => resolve(x.status === 0 || x.status === 200 ? (x.responseText || '') : ''));
        x.send();
      } catch (e) { resolve(''); }
    });
  }
  function loadScript(url) {
    return new Promise((resolve) => { const s = document.createElement('script'); s.src = url; s.onload = () => resolve(true); s.onerror = () => resolve(false); document.head.appendChild(s); });
  }
  function installStubEngine() {
    // Placeholder numbers only (a mean of burned as expenditure); enough to render. Engine-specific assertions skip.
    const addDays = (s, n) => addDaysIso(s, n);
    CMA.tdee = {
      RESPONSIVENESS: Object.freeze({ stable: 10, balanced: 15, responsive: 25 }),
      DEFAULT_CONFIG: Object.freeze({ warmupDays: 7, kcalPerKg: 7700 }),
      DEFAULT_CHECKIN: Object.freeze({ minKcal: { female: 1200, male: 1500, other: 1350 } }),
      addDays,
      runExpenditureModel(recs) {
        const days = recs.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
        const i0 = days.findIndex(d => d.weightKg != null);
        if (i0 < 0) return { days: [], current: null, error: 'NO_WEIGHT_DATA' };
        const b = days.map(d => d.burnedKcal).filter(v => v != null);
        const E = b.length ? Math.round(b.reduce((a, c) => a + c, 0) / b.length) : 2000;
        const out = days.slice(i0).map((d, k) => ({ date: d.date, scaleWeightKg: d.weightKg, trendWeightKg: d.weightKg || 80, expenditureKcal: E, expenditureSdKcal: 100, status: k < 7 ? 'warmup' : 'updating', calibrated: k >= 21, cronometerBurnedKcal: d.burnedKcal, weightOutlier: false }));
        const last = out[out.length - 1];
        return { days: out, current: { date: last.date, expenditureKcal: E, expenditureSdKcal: 100, trendWeightKg: last.trendWeightKg, status: last.status, calibrated: last.calibrated, priorKcal: E, priorSource: 'cronometer', weeklyTrendChangeKg: 0, avgIntake7Kcal: null, cronometerBurned14Kcal: E, cronometerCalibrationRatio: 1 } };
      },

      activityAwareDailyTarget(p) { return p.weeklyTargetKcal; },
      parseDailyNutritionCsv(t) { return t.trim().split(/\r?\n/).slice(1).map(l => ({ date: l.split(',')[0] })); },
      parseBiometricsCsv(t) { return t.trim().split(/\r?\n/).slice(1).map(l => ({ date: l.split(',')[0] })); }

  async function ensureEngine() {

    const src = await xhrText('../vendor/adaptive-tdee/adaptive-tdee.js');
    if (src && /^export function runExpenditureModel\(/m.test(src)) {
      const names = [];
      const body = src.replace(/^export (const|function) ([A-Za-z_$][\w$]*)/gm, (m, kw, name) => { names.push(name); return kw + ' ' + name; });
      const code = 'window.CMA = window.CMA || {};\n(function () {\n' + body + '\nwindow.CMA.tdee = { ' + names.join(', ') + ' };\n})();\n';
      await loadScript(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
      if (CMA.tdee && typeof CMA.tdee.runExpenditureModel === 'function') return { real: true, source: 'vendor/adaptive-tdee/adaptive-tdee.js (ES module converted in this page; src/tdee/adaptive-tdee.js not generated yet)' };

  describe('registration and consent', () => {
    it('the view registers a "TDEE" tab just before Diagnostics and injects its own stylesheet', () => {
      P.mount();
      const tabs = qa('.cma-tab').map(t => t.dataset.view);
      ok(tabs.indexOf('tdee') > tabs.indexOf('results') && tabs.indexOf('tdee') === tabs.indexOf('diagnostics') - 1, 'order: ' + tabs.join(','));
      eq(text(qa('.cma-tab').find(t => t.dataset.view === 'tdee')), 'TDEE');
      ok(P.VIEWS.indexOf('tdee') >= 0, 'CMA.panel.VIEWS lists it');
      const style = qa('style').find(s => s.dataset.view === 'tdee');
      ok(style && style.textContent === V.css, 'the view css is its own <style> in the shadow root');

    it('while disabled: the consent screen says what is read, that it stays in this browser, links PRIVACY and carries the disclaimer; nothing is read', async () => {
      await openTdee();
      const t = text(q('.cma-tdee-consent'));

      ok(/up to five years at first/.test(t) && /after you edit the diary in this tab \(also while the panel is closed\)/.test(t), 'how much and when');
      ok(/kept separately for each Cronometer account that enables it: one account never sees or changes another’s copy/.test(t) && !/replaces the stored copy/.test(t), 'per account');
      ok(/removes this account’s copy/.test(t), 'Delete TDEE data removes this account copy only');

      eq(V.test.comparisonText({ cronometerBurned14Kcal: 2100, cronometerCalibrationRatio: 1.08 }, u), 'Cronometer estimates 2,100 — your data says you burn about 8% more');

      ok(!/\b(red|green|lime|crimson)\b/i.test(css), 'no named red/green colours');
      await sub('overview');
      const root = q('.cma-tdee');
      eq(root.querySelectorAll('.cma-btn-primary, .cma-btn-danger, .cma-banner-ok, .cma-notice-error, .cma-ok, .cma-err').length, 0);
      eq(P.root.querySelectorAll('.cma-footer .cma-btn-primary, .cma-footer .cma-btn-danger').length, 0, 'footer too');
      const accent = getComputedStyle(P.root.querySelector('.cma')).getPropertyValue('--accent').trim();
      const probe = document.createElement('div'); probe.style.color = accent; document.body.appendChild(probe);
      const accentRgb = getComputedStyle(probe).color; probe.remove();
      const strong = q('.cma-tdee-primary') || q('.cma-tdee-btn');
      ok(strong, 'a TDEE button to measure');
      for (const e of [strong, q('.cma-tdee-chip'), q('.cma-tdee-num')]) {
        const cs = getComputedStyle(e);
        ok(cs.backgroundColor !== accentRgb && cs.color !== accentRgb, 'not the accent colour: ' + cs.backgroundColor + ' / ' + cs.color);
      }
    });
  });

  describe('diagnostics', () => {
    it('views.tdee carries counts, ranges and flags only — no weight, intake, burned, expenditure or target (and no nonce)', async () => {
      S.checkins = JSON.parse(JSON.stringify(S.calls.recordCheckin));   // the three check-ins recorded above (the delete test wiped them)
      const obj = P.diagnosticsObject();
      const d = obj.views && obj.views.tdee;
      ok(d && d.status && d.status.counts && d.status.counts.days === 60, 'counts present');
      eq(d.status.enabled, true); deepEq(d.checkins, { total: 3, accepted: 2, skipped: 1, lastDate: '2026-10-05' }, 'check-in counts only');
      ok(d.model && typeof d.model.days === 'number', 'model summary');
      const json = JSON.stringify(d);
      const all = P.diagnosticsText();
      const cur = model().current;
      ok(TARGETS.length >= 3, 'targets seen by the check-in tests');
      const forbidden = ['83.17', '83.2', '2517', '2,517', '2653', '2,653', '2617', String(cur.expenditureKcal), String(cur.trendWeightKg)]
        .concat(TARGETS.map(String), S.checkins.map(c => String(c.expenditureKcal)));
      for (const v of forbidden) {
        const re = new RegExp('(^|[^0-9.])' + v.replace(/[.,]/g, '\\$&') + '([^0-9]|$)');
        ok(!re.test(json), 'view diagnostics leak ' + v);
        ok(!re.test(all), 'diagnostics dump leaks ' + v);
      }
      for (const k of ['weightKg', 'intakeKcal', 'targetKcal', 'expenditureKcal', 'trendWeightKg', 'burnedKcal', 'macros']) ok(json.indexOf('"' + k + '"') < 0, 'key ' + k);
      ok(all.indexOf(window.__NONCE) < 0, 'no nonce in the dump');
    });
  });

  describe('lifecycle', () => {
    it('one tdee-data listener; unmount drops it and a remount renders again; switching away tells the view', async () => {
      await openTdee();
      eq(CMA.events.count('tdee-data'), 1);
      P.open('input');
      const n = S.calls.records.length;
      S.emit('data');
      await sleep(200);
      eq(S.calls.records.length, n, 'no recompute while another view is shown');
      P.unmount();
      eq(CMA.events.count('tdee-data'), 0, 'unsubscribed on unmount');
      P.mount();
      await openTdee();
      eq(CMA.events.count('tdee-data'), 1, 'one listener again');
      ok(q('.cma-tdee-exp'), 'rendered after the remount');
    });
  });

  // The same view against the REAL data layer (agent-built src/tdee/tdee-data.js), offline: no chrome.storage in a
  // plain page and no CMA.rpc, so its sync is blocked with a reason and the data comes from CSV files. Proves the
  // contract (status/ready, enable, importCsv, dayList, records, setOverride, saveSettings, recordCheckin, disable).
  describe('integration with the real data layer (src/tdee/tdee-data.js, offline: CSV files, no RPC client)', () => {
    let RD = false;
    const put = (id, name, body) => {
      const input = q(id);
      const dt = new DataTransfer();
      dt.items.add(new File([body], name, { type: 'text/csv' }));
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    };
    it('the real module replaces the stub; the view shows its consent screen', async () => {
      const loaded = await loadScript('../src/tdee/tdee-data.js');
      if (!loaded || !CMA.tdeeData || !CMA.tdeeData._test || CMA.tdeeData.probe === undefined) { ok(true, 'src/tdee/tdee-data.js not available: skipped'); return; }
      RD = true;
      CMA.tdeeData._test.configure({ today: () => '2026-09-28', spacingMs: 0, debounceMs: 0 });
      CMA.tdeeData._test.reset();
      V.test.reset(); V.test.reinit();
      P.open('input'); await openTdee();
      await rendered(() => q('.cma-tdee-consent'), 'consent from the real module');
      eq(CMA.tdeeData.status().enabled, false);
    });
    it('Enable turns reading on; without an RPC client the refresh is paused with the module\'s reason', async () => {
      if (!RD) return;
      button('Enable').click();
      await rendered(() => q('.cma-tdee-subnav') && CMA.tdeeData.status().enabled, 'enabled');
      await rendered(() => /Refreshing is paused: /.test(text(q('.cma-tdee-sync'))), 'blocked reason shown: ' + text(q('.cma-tdee-sync')));
      await rendered(() => /Log a weigh-in in Cronometer to start/.test(text(q('.cma-tdee-exp'))), 'empty state');
    });
    it('Daily Nutrition + Biometrics CSV files feed the real module: estimate, charts and history appear', async () => {
      if (!RD) return;
      const days = person({ n: 60 });
      const nut = 'Date,Energy (kcal),Protein (g)\n' + days.slice(0, -1).map(d => d.date + ',' + d.intakeKcal + ',150').join('\n') + '\n';
      const bio = 'Day,Time,Group,Metric,Unit,Amount\n' + days.map(d => d.date + ',07:00 AM,,Weight,kg,' + d.weightKg).join('\n') + '\n';
      await sub('settings');
      put('#cma-tdee-csv-nutrition', 'dailysummary.csv', nut);
      await rendered(() => /Daily Nutrition CSV: 59 days read, 0 skipped\./.test(text(q('.cma-tdee-msg'))), 'nutrition read: ' + text(q('.cma-tdee-msg')));
      put('#cma-tdee-csv-biometrics', 'biometrics.csv', bio);
      await rendered(() => /Biometrics CSV: 60 days read, 0 skipped\./.test(text(q('.cma-tdee-msg'))), 'biometrics read: ' + text(q('.cma-tdee-msg')));
      await sub('overview');
      await rendered(() => q('.cma-tdee-chip') && q('.cma-tdee-charts'), 'estimate + charts');
      eq(CMA.tdeeData.status().counts.weighIns, 60);
      ok(/No Cronometer burned figures for the last 14 days/.test(text(q('.cma-tdee-exp'))), 'no burned in CSV files');
      if (REAL) { eq(model().current.priorSource, 'intake'); eq(model().days.length, 60); ok(model().days[59].intakeKcal === null, "today's intake is not counted"); }
      await sub('history');
      await rendered(() => qa('.cma-tdee-hrow').length === 60, '60 history rows');
      eq(qa('.cma-tdee-hrow')[0].dataset.date, '2026-09-28');
    });
    it('the exclude toggle stores a real override; a check-in is recorded with its time and becomes the target', async () => {
      if (!RD) return;
      const row = () => qa('.cma-tdee-hrow').find(r => r.dataset.date === '2026-09-20');
      row().querySelector('.cma-tdee-excl').click();
      await rendered(() => { const d = CMA.tdeeData.dayList().find(x => x.date === '2026-09-20'); return d && d.excluded && d.excludedReason === 'user'; }, 'override stored');
      await rendered(() => row() && row().querySelector('.cma-tdee-excl').checked, 'row re-rendered');
      await sub('overview');
      await rendered(() => q('.cma-tdee-checkin') && !q('.cma-tdee-checkin').disabled, 'check-in due');
      q('.cma-tdee-checkin').click();
      await rendered(() => q('.cma-tdee-accept'), 'dialog');
      q('.cma-tdee-accept').click();
      await rendered(() => q('.cma-tdee-newtarget'), 'accepted');
      const cis = CMA.tdeeData.checkins();
      eq(cis.length, 1); eq(cis[0].accepted, true); eq(typeof cis[0].at, 'number'); eq(cis[0].date, '2026-09-28');
      q('.cma-tdee-done').click();
      await rendered(() => q('.cma-tdee-checkin') && q('.cma-tdee-checkin').disabled, 'not due again');
      eq(text(q('.cma-tdee-target .cma-tdee-num')), V.test.fmtInt(cis[0].targetKcal));
    });
    it('a goal change saved through the real module re-opens the check-in at once', async () => {
      if (!RD) return;
      await sleep(20);
      await sub('settings');
      eq(q('#cma-tdee-s-goal').value, '0', "the real module's default goal is Maintain");
      q('#cma-tdee-s-goal').value = '-0.5';
      q('.cma-tdee-save').click();
      await rendered(() => CMA.tdeeData.getSettings().goal.ratePctPerWeek === -0.5 && CMA.tdeeData.getSettings().goalChangedAt > 0, 'saved with goalChangedAt');
      await sub('overview');
      await rendered(() => q('.cma-tdee-checkin') && !q('.cma-tdee-checkin').disabled && /Your goal changed/.test(text(q('.cma-tdee-next'))), 're-opened');
      const d = JSON.stringify(P.diagnosticsObject().views.tdee);
      ok(d.indexOf('83.17') < 0 && d.indexOf('2517') < 0, 'no weights or intakes in the view diagnostics with the real module either');
    });
    it('"Delete TDEE data" makes the real module forget everything; the consent screen returns', async () => {
      if (!RD) return;
      await sub('settings');
      q('.cma-tdee-del').click();
      await rendered(() => q('.cma-tdee-del-yes'), 'confirmation');
      q('.cma-tdee-del-yes').click();
      await rendered(() => q('.cma-tdee-consent'), 'consent screen');
      eq(CMA.tdeeData.status().enabled, false); eq(CMA.tdeeData.dayList().length, 0); eq(CMA.tdeeData.checkins().length, 0);
    });
  });

  CMA.test.run({ timeoutMs: 10000 });
})();
</script>
</body>
</html>
