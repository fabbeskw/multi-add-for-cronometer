<pre id="results"></pre>

<script src="../src/lib/plan.js"></script>
<script src="../src/lib/engine-rpc.js"></script>
<script>
(function () {
  const T = CMA.test;
  const { describe, it, ok, eq, deepEq, approx, throws } = T;

  // ===========================================================================
  // Fake CMA.rpc (spec-shaped values, SPEC §3.3 / §4) — no gwt-stream needed.
  // ===========================================================================
  const SERVING = 'com.cronometer.shared.entries.models.Serving/2553599101';
  const DAY = 'com.cronometer.shared.entries.models.Day/782579793';
  const FOOD = 'com.cronometer.shared.foods.models.Food/2097636843';
  const FOODMEASURES = 'com.cronometer.shared.foods.models.FoodMeasures/2106205728';
  const MEASURE = 'com.cronometer.shared.foods.models.Measure/1979099908';
  const MTYPE = 'com.cronometer.shared.foods.models.Measure$Type/1';
  const DAYINFO = 'com.cronometer.shared.entries.models.DayInfo/416556043';
  const TYPES = { Weight: 0, Volume: 1, Atomic: 2, Recipe: 3 };

  function measure(foodId, id, name, grams, type) {
    // Measure/1979099908: [d a, z b, i foodId, z d, i measureId, o f, s name, o i, o type, d gramsPerUnit]
    return { $t: MEASURE, f: [0, false, foodId, false, id, null, name, null, { $t: MTYPE, ordinal: TYPES[type] }, grams] };
  }
  function food(id, name, defaultMeasureId, measures, type) {
    const f = new Array(20).fill(null);
    f[0] = 0; f[1] = false; f[3] = 0; f[4] = name; f[5] = 0; f[6] = 0; f[7] = id; f[10] = 0;
    f[11] = { $t: FOODMEASURES, f: [defaultMeasureId, measures] };
    f[14] = false; f[15] = 'usda'; f[17] = []; f[18] = type || null; f[19] = 0;
    return { $t: FOOD, f };
  }
  const DB = [
    { id: 100, name: 'Chicken Breast', hitMeasureId: 1003, translationId: 0, m: [
      measure(100, 1001, 'g', 1, 'Weight'), measure(100, 1002, 'oz', 28.35, 'Weight'), measure(100, 1003, 'breast', 174, 'Atomic')] },
    { id: 101, name: 'Chicken Breast, Grilled', hitMeasureId: 1101, translationId: 0, m: [measure(101, 1101, 'g', 1, 'Weight')] },
    { id: 200, name: 'Egg, Whole, Raw', hitMeasureId: 2001, translationId: 777, hitName: 'Eggs', m: [
      measure(200, 2001, 'large', 50, 'Atomic'), measure(200, 2002, 'medium', 44, 'Atomic'), measure(200, 2003, 'extra large', 56, 'Atomic'),
      measure(200, 2004, 'g', 1, 'Weight'), measure(200, 2005, 'cup', 243, 'Volume')] },
    { id: 300, name: 'Rice, White, Cooked', hitMeasureId: 3001, translationId: 0, m: [
      measure(300, 3001, 'cup', 158, 'Volume'), measure(300, 3002, 'g', 1, 'Weight')] },
    { id: 400, name: 'Olive Oil', hitMeasureId: 4001, translationId: 0, m: [
      measure(400, 4001, 'tbsp', 13.5, 'Volume'), measure(400, 4002, 'tsp', 4.5, 'Volume'), measure(400, 4003, 'g', 1, 'Weight')] },
    { id: 500, name: 'Banana', hitMeasureId: 5001, translationId: 0, m: [
      measure(500, 5001, 'medium', 118, 'Atomic'), measure(500, 5002, 'g', 1, 'Weight'), measure(500, 5003, 'cup, sliced', 150, 'Volume')] },
    { id: 600, name: 'Milk, Whole', hitMeasureId: 6001, translationId: 0, m: [
      measure(600, 6001, 'cup', 244, 'Volume'), measure(600, 6002, 'g', 1, 'Weight')] },
    { id: 700, name: 'My Smoothie', hitMeasureId: 7001, translationId: 0, m: [
      measure(700, 7001, 'serving', 350, 'Recipe')] },
    { id: 800, name: 'Protein Powder', hitMeasureId: 8001, translationId: 0, m: [
      measure(800, 8001, 'scoop', 30, 'Atomic')] },
    { id: 900, name: 'Salmon, Atlantic', hitMeasureId: 9001, translationId: 0, m: [
      measure(900, 9001, 'oz', 28.35, 'Weight'), measure(900, 9002, 'fillet', 170, 'Atomic')] },
    // hit.measureId 0 (a custom food: rpc.mapHit maps a missing /food-search/string measureId to 0) and no f[0]:
    // the plain 'g' would be the default — SPEC §5.3 no-unit rule
    { id: 1000, name: 'Quest Snack', hitMeasureId: 0, defaultId: 0, translationId: 0, m: [
      measure(1000, 10001, 'g', 1, 'Weight'), measure(1000, 10002, 'bar', 60, 'Atomic')] },
    { id: 1100, name: 'Whey Isolate', hitMeasureId: 0, defaultId: 0, translationId: 0, m: [measure(1100, 11001, 'g', 1, 'Weight')] },
    // hit unusable but FoodMeasures.f[0] names the 'bar' measure (the dialog's TCe default)
    { id: 1200, name: 'Granola Crunch', hitMeasureId: 0, defaultId: 12002, translationId: 0, m: [
      measure(1200, 12001, 'g', 1, 'Weight'), measure(1200, 12002, 'bar', 45, 'Atomic')] }
  ];
  const FOODS = {};
  for (const d of DB) FOODS[d.id] = food(d.id, d.name, d.defaultId != null ? d.defaultId : d.hitMeasureId, d.m);

  function makeFake() {
    const fake = {
      calls: [],            // {method, t, args}
      failScript: {},       // method → [fn(callIndex) → error|null]
      dayServings: [],      // Serving values returned by getDayInfo
      dayInfoError: null,
      nextId: 1
    };
    function rec(method, args) { fake.calls.push({ method, t: Date.now(), args }); }
    function maybeFail(method) {
      const q = fake.failScript[method];
      if (q && q.length) { const e = q.shift(); if (e) throw e; }
    }
    fake.rpc = {
      async searchFoods(session, query, opts) {
        rec('searchFoods', [query, opts]); maybeFail('searchFoods');
        const q = String(query).toLowerCase();
        return DB.filter(d => (d.hitName || d.name).toLowerCase().indexOf(q.split(',')[0].split(' ')[0]) >= 0)
          .map(d => ({ id: d.id, name: d.hitName || d.name, measureId: d.hitMeasureId, measureDisplayName: '',
            score: 1, source: 'usda', type: 'Food', translationId: d.translationId, retired: false }));
      },
      async getFood(session, id) {
        rec('getFood', [id]); maybeFail('getFood');
        if (!FOODS[id]) throw new Error('no such food ' + id);
        return FOODS[id];
      },
      measuresOf(f) {
        const list = f.f[11].f[1];
        return list.map(m => ({ id: m.f[4], name: m.f[6], grams: m.f[9], foodId: m.f[2],
          type: ['Weight', 'Volume', 'Atomic', 'Recipe'][m.f[8].ordinal] }));
      },
      async getDayInfo(session, day) {
        rec('getDayInfo', [day]); maybeFail('getDayInfo');
        if (fake.dayInfoError) throw fake.dayInfoError;
        const note = { $t: 'com.cronometer.shared.entries.models.Note/1', f: [null, 99] };
        return { $t: DAYINFO, f: [true, { $t: DAY, f: [day.day, day.month, day.year] }, fake.dayServings.slice(), [note], false, ''] };
      },
      servingsOf(di) {
        return [].concat(di.f[2] || [], di.f[3] || []).filter(e => e && e.$t === SERVING);
      },
      async updateDiaryAdd(session, serving) {
        rec('updateDiaryAdd', [serving]); maybeFail('updateDiaryAdd');
        const id = 'SID' + (fake.nextId++);
        const s = { $t: SERVING, f: serving.f.slice() }; s.f[9] = id;
        return { servingId: id, serving: s };
      },
      async removeServing(session, id) {
        rec('removeServing', [id]); maybeFail('removeServing');
        return true;
      }
    };
    return fake;
  }
  function servingWithOrder(order) {
    return { $t: SERVING, f: [{ $t: DAY, f: [4, 3, 2026] }, true, true, null, order, null, 0, 50, 464674, 'D80lp$', 1072101, 0, 0] };
  }
  const SESSION = { moduleBase: 'https://cronometer.com/cronometer/', permutation: 'P', policyHash: 'H', nonce: 'NONCE', userId: 1234567 };
  const GROUPS = [
    { id: 0, name: 'Uncategorized', enabled: true }, { id: 1, name: 'Breakfast', enabled: true },
    { id: 2, name: 'Lunch', enabled: true }, { id: 3, name: 'Dinner', enabled: true },
    { id: 4, name: 'Snacks', enabled: true }, { id: 5, name: 'Group 6', enabled: false },
    { id: 6, name: 'Group 7', enabled: false }, { id: 7, name: 'Group 8', enabled: false }
  ];
  const DATE = { day: 4, month: 3, year: 2026 };
  const FAST = { groups: GROUPS, defaultGroupId: 3, date: DATE, searchDelayMs: 30, retryMs: 40 };

  // ===========================================================================
  // §5 parser
  // ===========================================================================
  describe('parse.lines — SPEC §5 examples', () => {
    const cases = [
      ['200g chicken breast', 200, 'g', 'chicken breast'],
      ['chicken breast 200 g', 200, 'g', 'chicken breast'],
      ['chicken breast, 200g', 200, 'g', 'chicken breast'],
      ['Chicken breast - 200 g', 200, 'g', 'Chicken breast'],
      ['2 large eggs', 2, 'large', 'eggs'],
      ['2 eggs', 2, null, 'eggs'],
      ['eggs x2', 2, null, 'eggs'],
      ['2x eggs', 2, null, 'eggs'],
      ['x2 eggs', 2, null, 'eggs'],
      ['eggs ×2', 2, null, 'eggs'],
      ['1 1/2 cups rice, cooked', 1.5, 'cup', 'rice, cooked'],
      ['½ cup oats', 0.5, 'cup', 'oats'],
      ['1½ cups oats', 1.5, 'cup', 'oats'],
      ['¼ cup almonds', 0.25, 'cup', 'almonds'],
      ['¾ cup milk', 0.75, 'cup', 'milk'],
      ['⅓ cup rice', 1 / 3, 'cup', 'rice'],
      ['⅔ cup rice', 2 / 3, 'cup', 'rice'],
      ['banana', null, null, 'banana'],
      ['3 tbsp olive oil', 3, 'tbsp', 'olive oil'],
      ['100 ml milk', 100, 'ml', 'milk'],
      ['100ml milk', 100, 'ml', 'milk'],
      ['1 slice bread', 1, 'slice', 'bread'],
      ['0.5 kg potatoes', 500, 'g', 'potatoes'],
      ['500 mg vitamin c', 0.5, 'g', 'vitamin c'],
      ['1 l water', 1000, 'ml', 'water'],
      ['2oz cheese', 2, 'oz', 'cheese'],
      ['1 lb ground beef', 1, 'lb', 'ground beef'],
      ['1.5 cups milk', 1.5, 'cup', 'milk'],
      ['.5 cup milk', 0.5, 'cup', 'milk'],
      ['1,5 cups milk', 1.5, 'cup', 'milk'],
      ['rice, 1,5 cups', 1.5, 'cup', 'rice'],          // other comma is a list separator
      ['cereal, milk, 1,5 cups', 1.5, 'cup', 'cereal, milk'],
      ['1/2 cup oats', 0.5, 'cup', 'oats'],
      ['oats 1/2 cup', 0.5, 'cup', 'oats'],
      ['rice 1 1/2 cups', 1.5, 'cup', 'rice'],
      ['chicken breast: 200 g', 200, 'g', 'chicken breast'],
      ['chicken breast x 2', 2, null, 'chicken breast'],
      ['2 tablespoons peanut butter', 2, 'tbsp', 'peanut butter'],
      ['2 teaspoons sugar', 2, 'tsp', 'sugar'],
      ['3 pieces sushi', 3, 'piece', 'sushi'],
      ['2 pcs sushi', 2, 'piece', 'sushi'],
      ['1 serving lasagna', 1, 'serving', 'lasagna'],
      ['1 scoop whey', 1, 'scoop', 'whey'],
      ['1 can tuna', 1, 'can', 'tuna'],
      ['1 medium apple', 1, 'medium', 'apple'],
      ['1 small apple', 1, 'small', 'apple'],
      ['1 xl egg', 1, 'xl', 'egg'],
      ['2 extra large eggs', 2, 'xl', 'eggs'],
      ['2 fl oz whisky', 2, 'fl oz', 'whisky'],
      ['2 fluid ounces whisky', 2, 'fl oz', 'whisky'],
      ['2 cloves garlic', 2, 'clove', 'garlic'],
      ['1 bottle beer', 1, 'bottle', 'beer'],
      ['1 packet oatmeal', 1, 'packet', 'oatmeal'],
      ['1 bar chocolate', 1, 'bar', 'chocolate'],
      ['3 ea tortillas', 3, 'each', 'tortillas'],
      ['2 units bread', 2, 'unit', 'bread'],
      ['2 grams salt', 2, 'g', 'salt'],
      ['2 gr salt', 2, 'g', 'salt'],
      ['2 ounces cheese', 2, 'oz', 'cheese'],
      ['2 lbs beef', 2, 'lb', 'beef'],
      ['100 mL milk', 100, 'ml', 'milk'],
      ['250 millilitres milk', 250, 'ml', 'milk'],
      ['2 cupcakes', 2, null, 'cupcakes'],          // unknown token stays in the name (not 'cup')
      ['2 tablets ibuprofen', 2, 'tablet', 'ibuprofen'],
      ['omega 3 fatty acids', null, null, 'omega 3 fatty acids'], // bare number mid-line is not a qty
      ['omega 3 500mg', 0.5, 'g', 'omega 3'],
      ['chicken 200g cooked', 200, 'g', 'chicken cooked'],
      ['banana 1', 1, null, 'banana'],
      ['vitamin d3', null, null, 'vitamin d3'],
      ['salmon 150g', 150, 'g', 'salmon'],
      ['  Apple  ', null, null, 'Apple'],
      ['2 whole eggs', 2, null, 'whole eggs']
    ];
    for (const [text, qty, unit, name] of cases) {
      it(JSON.stringify(text), () => {
        const items = CMA.parse.lines(text);
        eq(items.length, 1, 'one item');
        const r = items[0];
        eq(r.name, name, 'name');
        if (qty == null) eq(r.qty, null, 'qty'); else approx(r.qty, qty, 1e-9, 'qty');
        eq(r.unit, unit, 'unit');
        eq(r.raw, text, 'raw');
        ok(!r.error, 'no error: ' + r.error);
      });
    }
  });

  describe('parse.lines — groups, tags, comments, errors', () => {
    it('## Dinner group line switches the group and emits no item', () => {
      const items = CMA.parse.lines('banana\n## Dinner\nsalmon 150g\n# Snacks\napple');
      eq(items.length, 3);
      eq(items[0].group, null);
      eq(items[1].group, 'Dinner');
      eq(items[1].name, 'salmon');
      eq(items[2].group, 'Snacks');
      deepEq(items.map(i => i.line), [1, 3, 5]);
    });
    it('@lunch tag at the end sets the line group only', () => {
      const items = CMA.parse.lines('## Dinner\nsalmon 150g @lunch\nrice 1 cup');
      eq(items[0].group, 'lunch');
      eq(items[0].name, 'salmon');
      eq(items[0].qty, 150);
      eq(items[0].unit, 'g');
      eq(items[1].group, 'Dinner');
    });
    it('@Breakfast tag at the start', () => {
      const items = CMA.parse.lines('@Breakfast 2 eggs');
      eq(items[0].group, 'Breakfast');
      eq(items[0].name, 'eggs');
      eq(items[0].qty, 2);
    });
    it('blank lines, bare # and // lines are ignored', () => {
      const items = CMA.parse.lines('\n   \n#\n// note\nbanana\n');
      eq(items.length, 1);
      eq(items[0].name, 'banana');
    });
    it('CRLF input', () => {
      const items = CMA.parse.lines('banana\r\n2 eggs\r\n');
      eq(items.length, 2);
      eq(items[1].qty, 2);
    });
    it('line with only a quantity → error', () => {
      const items = CMA.parse.lines('200g');
      eq(items.length, 1);
      eq(items[0].error, 'no food name');
    });
    it('zero / division-by-zero quantities → error', () => {
      eq(CMA.parse.lines('0 eggs')[0].error, 'invalid quantity');
      eq(CMA.parse.lines('1/0 cup rice')[0].error, 'invalid quantity');
    });
    it('null / empty input → []', () => {
      deepEq(CMA.parse.lines(null), []);
      deepEq(CMA.parse.lines(''), []);
    });
    it('a `# note` after `## Dinner` is a comment: the group stays Dinner', () => {
      const items = CMA.parse.lines('## Dinner\n# leftovers from yesterday\nsalmon 150g\n# a comment\nrice 1 cup');
      eq(items.length, 2);
      eq(items[0].group, 'Dinner'); eq(items[0].name, 'salmon');
      eq(items[1].group, 'Dinner');
      eq(items[0].groupFallback, undefined);
    });
    it('group-name-like `# Lunch` / `# Group 6` / `# Second breakfast` lines switch the group (with a fallback chain)', () => {
      const items = CMA.parse.lines('# Lunch\nrice 1 cup\n# Group 6\nbanana\n# Second breakfast\napple\n# snacks\npear');
      deepEq(items.map(i => i.group), ['Lunch', 'Group 6', 'Second breakfast', 'snacks']);
      deepEq(items[3].groupFallback, ['Second breakfast', 'Group 6', 'Lunch']);
      ok(CMA.parse.looksLikeGroupName('Lunch') && CMA.parse.looksLikeGroupName('Group 6') && CMA.parse.looksLikeGroupName('Second breakfast'));
      ok(!CMA.parse.looksLikeGroupName('a comment') && !CMA.parse.looksLikeGroupName('leftovers from yesterday') && !CMA.parse.looksLikeGroupName('note: skip.'));
      const tagged = CMA.parse.lines('## Dinner\nsalmon 150g @brunchx');
      eq(tagged[0].group, 'brunchx'); deepEq(tagged[0].groupFallback, ['Dinner']);
    });
    it('`Breakfast:` / `Lunch:` header lines switch the group and emit no item', () => {
      const items = CMA.parse.lines('Breakfast:\n2 eggs\nLunch:\nrice 200g');
      eq(items.length, 2);
      eq(items[0].name, 'eggs'); eq(items[0].group, 'Breakfast');
      eq(items[1].name, 'rice'); eq(items[1].group, 'Lunch');
      // a header-looking bare word without the colon is still an item (plan.build flags it)
      const bare = CMA.parse.lines('Breakfast\n2 eggs');
      eq(bare.length, 2); eq(bare[0].name, 'Breakfast'); eq(bare[0].qty, null);
      eq(CMA.parse.lines('chicken breast: 200 g')[0].qty, 200, 'a quantity line ending in a unit is not a header');
    });
    it('multipliers: N x <qty><unit> and <qty><unit> x N', () => {
      const one = (t) => CMA.parse.lines(t)[0];
      let r = one('2 x 100g yoghurt'); eq(r.qty, 200); eq(r.unit, 'g'); eq(r.name, 'yoghurt');
      r = one('3 x 30g protein bar'); eq(r.qty, 90); eq(r.unit, 'g'); eq(r.name, 'protein bar');
      r = one('2 × 100 g yoghurt'); eq(r.qty, 200); eq(r.unit, 'g'); eq(r.name, 'yoghurt');
      r = one('yoghurt 2 x 100g'); eq(r.qty, 200); eq(r.unit, 'g'); eq(r.name, 'yoghurt');
      r = one('Vitamin C 500mg x2'); approx(r.qty, 1, 1e-9); eq(r.unit, 'g'); eq(r.name, 'Vitamin C');
      r = one('protein bar 60g 2x'); eq(r.qty, 120); eq(r.unit, 'g'); eq(r.name, 'protein bar');
      r = one('2 x eggs'); eq(r.qty, 2); eq(r.unit, null); eq(r.name, 'eggs');
    });
    it('two foods on one line are split into two items with the same line number', () => {
      const items = CMA.parse.lines('oats 40 g, milk 200 ml\nchicken breast 200g; rice 150g');
      eq(items.length, 4);
      deepEq(items.map(i => [i.name, i.qty, i.unit, i.line, i.part]), [['oats', 40, 'g', 1, 0], ['milk', 200, 'ml', 1, 1], ['chicken breast', 200, 'g', 2, 0], ['rice', 150, 'g', 2, 1]]);
      eq(items[0].raw, 'oats 40 g, milk 200 ml');
      // single-food lines with commas stay whole
      let r = CMA.parse.lines('rice, 1,5 cups'); eq(r.length, 1); eq(r[0].qty, 1.5); eq(r[0].name, 'rice');
      r = CMA.parse.lines('1 1/2 cups rice, cooked'); eq(r.length, 1); eq(r[0].name, 'rice, cooked');
      r = CMA.parse.lines('cereal, milk, 1,5 cups'); eq(r.length, 1);
      deepEq(CMA.parse.splitSegments('oats 40,5 g, milk 200 ml'), ['oats 40.5 g', 'milk 200 ml']);
    });
    it('percentages and digit-led product names are not quantities', () => {
      const one = (t) => CMA.parse.lines(t)[0];
      let r = one('2% milk 1 cup'); eq(r.qty, 1); eq(r.unit, 'cup'); eq(r.name, '2% milk');
      r = one('1% milk, 250 ml'); eq(r.qty, 250); eq(r.unit, 'ml'); eq(r.name, '1% milk');
      r = one('0% greek yogurt 150g'); eq(r.qty, 150); eq(r.unit, 'g'); eq(r.name, '0% greek yogurt'); ok(!r.error, r.error);
      r = one('7up 330 ml'); eq(r.qty, 330); eq(r.unit, 'ml'); eq(r.name, '7up');
      r = one('12% cream'); eq(r.qty, null); eq(r.name, '12% cream');
    });
    it('normalizeUnit synonyms and unknowns', () => {
      eq(CMA.parse.normalizeUnit('Grams'), 'g');
      eq(CMA.parse.normalizeUnit('tbsp.'), 'tbsp');
      eq(CMA.parse.normalizeUnit('fl. oz'), 'fl oz');
      eq(CMA.parse.normalizeUnit('Tablespoons'), 'tbsp');
      eq(CMA.parse.normalizeUnit('eggs'), null);
      eq(CMA.parse.normalizeUnit(''), null);
      eq(CMA.parse.normalizeUnit(null), null);
    });
  });

  // ===========================================================================
  // §5.3 units.pickMeasure
  // ===========================================================================
  const M = {
    chicken: [{ id: 1001, name: 'g', grams: 1, type: 'Weight', foodId: 100 }, { id: 1002, name: 'oz', grams: 28.35, type: 'Weight', foodId: 100 },
      { id: 1003, name: 'breast', grams: 174, type: 'Atomic', foodId: 100 }],
    noGram: [{ id: 1, name: 'breast', grams: 174, type: 'Atomic', foodId: 1 }, { id: 2, name: 'oz', grams: 28.35, type: 0, foodId: 1 }],
    onlyAtomic: [{ id: 8001, name: 'scoop', grams: 30, type: 'Atomic', foodId: 800 }],
    rice: [{ id: 3001, name: 'cup', grams: 158, type: 'Volume', foodId: 300 }, { id: 3002, name: 'g', grams: 1, type: 'Weight', foodId: 300 }],
    banana: [{ id: 5001, name: 'medium', grams: 118, type: 2, foodId: 500 }, { id: 5002, name: 'g', grams: 1, type: 0, foodId: 500 },
      { id: 5003, name: 'cup, sliced', grams: 150, type: 1, foodId: 500 }],
    oil: [{ id: 4001, name: 'tbsp', grams: 13.5, type: 'Volume', foodId: 400 }, { id: 4002, name: 'tsp', grams: 4.5, type: 'Volume', foodId: 400 },
      { id: 4003, name: 'g', grams: 1, type: 'Weight', foodId: 400 }],
    eggs: [{ id: 2001, name: 'large', grams: 50, type: 'Atomic', foodId: 200 }, { id: 2002, name: 'medium', grams: 44, type: 'Atomic', foodId: 200 },
      { id: 2003, name: 'extra large', grams: 56, type: 'Atomic', foodId: 200 }, { id: 2004, name: 'g', grams: 1, type: 'Weight', foodId: 200 }],
    recipe: [{ id: 7001, name: 'serving', grams: 350, type: 'Recipe', foodId: 700 }, { id: 7002, name: 'g', grams: 1, type: 'Weight', foodId: 700 }],
    fullRecipe: [{ id: 7101, name: 'full recipe', grams: 0, type: 'Weight', foodId: 710 }],
    volOnlyOdd: [{ id: 1, name: 'ladle', grams: 120, type: 'Volume', foodId: 1 }, { id: 2, name: 'g', grams: 1, type: 'Weight', foodId: 1 }]
  };
  describe('units.pickMeasure — no unit typed: the default-measure rule (SPEC §5.3)', () => {
    const bar = [{ id: 1, name: 'g', grams: 1, type: 'Weight', foodId: 9 }, { id: 2, name: 'bar', grams: 60, type: 'Atomic', foodId: 9 }];
    const gOnly = [{ id: 1, name: 'g', grams: 1, type: 'Weight', foodId: 9 }];
    const gramsNamed = [{ id: 1, name: 'grams', grams: 1, type: 'Weight', foodId: 9 }, { id: 2, name: 'serving (2 tbsp)', grams: 30, type: 'Volume', foodId: 9 }];

    const mlOnly = [{ id: 1, name: 'ml', grams: 1.03, type: 'Volume', foodId: 9 }];

    it('adds ready rows sequentially, in order, with the delay between rows; skips non-ready rows', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, '200g chicken breast\n2 large eggs\nnothing here\n1 cup chicken breast\nbanana');
      fake.calls.length = 0;
      const events = [];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS, e => events.push(e));
      eq(res.added.length, 3);
      eq(res.failed.length, 0);
      eq(res.skipped.length, 2);
      eq(res.stopped, null);
      deepEq(res.added.map(a => a.row.index), [0, 1, 4]);
      deepEq(res.added.map(a => a.servingId), ['SID1', 'SID2', 'SID3']);
      const calls = fake.calls.filter(c => c.method === 'updateDiaryAdd');
      eq(calls.length, 3);
      deepEq(calls.map(c => c.args[0].f[8]), [100, 200, 500], 'foodIds in row order');
      ok(calls[1].t - calls[0].t >= 35, 'delay 1: ' + (calls[1].t - calls[0].t));
      ok(calls[2].t - calls[1].t >= 35, 'delay 2: ' + (calls[2].t - calls[1].t));
      // the serving sent is exactly the §4 shape
      const s = calls[0].args[0];
      eq(s.$t, SERVING); eq(s.f.length, 13); eq(s.f[0].$t, DAY); deepEq(s.f[0].f, [4, 3, 2026]);
      eq(s.f[1], true); eq(s.f[2], true); eq(s.f[3], null); eq(s.f[4], (3 << 16) | 1); eq(s.f[5], null); eq(s.f[6], 0);
      eq(s.f[7], 200); eq(s.f[8], 100); eq(s.f[9], 0); eq(s.f[10], 1001); eq(s.f[11], 0); eq(s.f[12], 0);
      // lastBatch
      ok(res.lastBatch && res.lastBatch.servingIds.length === 3);
      deepEq(CMA.engineRpc.lastBatch.servingIds, ['SID1', 'SID2', 'SID3']);
      deepEq(CMA.engineRpc.lastBatch.date, DATE);
      ok(typeof CMA.engineRpc.lastBatch.at === 'number');
      ok(events.some(e => e.phase === 'row' && e.ok === true) && events[events.length - 1].phase === 'done');
      ok(plan.rows[0].result && plan.rows[0].result.ok && plan.rows[0].result.servingId === 'SID1');
    });

    it('retries once after a network error, then succeeds', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [new CMA.errors.Network('Failed to fetch')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.added.length, 2); eq(res.failed.length, 0);
      const calls = fake.calls.filter(c => c.method === 'updateDiaryAdd');
      eq(calls.length, 3);
      ok(calls[1].t - calls[0].t >= 45, 'retry wait ' + (calls[1].t - calls[0].t));
      eq(calls[0].args[0].f[4], calls[1].args[0].f[4], 'same serving retried');
    });

    it('a plain TypeError("Failed to fetch") also counts as a network error', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana');
      fake.failScript.updateDiaryAdd = [new TypeError('Failed to fetch')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.added.length, 1);
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 2);
    });

    it('two consecutive network errors → row failed after exactly one retry; batch continues', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [new CMA.errors.Network('a'), new CMA.errors.Network('b')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.failed.length, 1); eq(res.failed[0].row.index, 0); eq(res.failed[0].kind, 'network');
      eq(res.added.length, 1); eq(res.added[0].row.index, 1);
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 3);
    });

    it('a timed-out updateDiary is NOT retried (it may have reached the server): the row fails with kind timeout', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [new CMA.errors.Network('request timed out after 30000 ms', { timeout: true })];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.failed.length, 1); eq(res.failed[0].kind, 'timeout'); ok(/check the diary before re-adding/.test(res.failed[0].error), res.failed[0].error);
      eq(res.added.length, 1);
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 2, 'no retry of the timed-out add');
      eq(res.lastBatch.userId, 1234567, 'the batch carries the userId it belongs to');
    });
    it('an undecodable //OK (rpc error with .applied) counts as added without an id and stops the batch', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      fake.calls.length = 0;
      const dec = new Error('cannot decode the updateDiary response: GWT: unknown type signature x/1'); dec.kind = 'decode'; dec.applied = true;
      fake.failScript.updateDiaryAdd = [null, dec];
      const events = [];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS, e => events.push(e));
      eq(res.stopped, 'decode');
      eq(res.added.length, 2, 'the row whose reply was unreadable is ADDED, not failed');
      eq(res.added[1].servingId, null); ok(/added; the reply could not be read/.test(res.added[1].message), res.added[1].message);
      ok(plan.rows[1].result && plan.rows[1].result.ok === true && plan.rows[1].result.servingId === null);
      eq(res.failed.length, 0);
      eq(res.skipped.length, 1); ok(/not attempted \(decode\)/.test(res.skipped[0].reason), res.skipped[0].reason);
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 2, 'never re-sent, and the third row was not sent');
      deepEq(res.lastBatch.servingIds, ['SID1'], 'only the readable id can be undone');
      ok(events.some(e => e.phase === 'row' && e.ok === true && e.servingId === null && /could not be read/.test(e.message)), 'progress carries the note');
      // an undecodable //OK with no readable row at all leaves no batch behind
      const fake2 = makeFake();
      const plan2 = await buildPlan(fake2, 'banana');
      fake2.failScript.updateDiaryAdd = [dec];
      const res2 = await CMA.engineRpc.run(SESSION, plan2, ENGINE_OPTS);
      eq(res2.added.length, 1); eq(res2.lastBatch, null);
    });
    it('sessionProvider: a nonce rotated mid-batch is used from the next row on (run, undo and plan.build)', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      const seen = [];
      const orig = fake.rpc.updateDiaryAdd;
      fake.rpc.updateDiaryAdd = async (session, serving) => { seen.push(session.nonce); return orig(session, serving); };
      let nonce = 'FIRST';
      const res = await CMA.engineRpc.run({ moduleBase: 'x', nonce: 'SNAPSHOT', userId: 1 }, plan, Object.assign({}, ENGINE_OPTS, { sessionProvider: () => { const s = Object.assign({}, SESSION, { nonce }); nonce = 'ROTATED'; return s; } }));
      eq(res.added.length, 2);
      deepEq(seen, ['FIRST', 'ROTATED']);
      eq(res.lastBatch.userId, 1, 'the batch owner comes from the snapshot the panel passed');
      const removed = [];
      const origRm = fake.rpc.removeServing;
      fake.rpc.removeServing = async (session, id) => { removed.push(session.nonce); return origRm(session, id); };
      await CMA.engineRpc.undo(SESSION, res.lastBatch, { delayMs: 1, refresh: false, sessionProvider: () => Object.assign({}, SESSION, { nonce: 'UNDO' }) });
      deepEq(removed, ['UNDO', 'UNDO']);
      // a provider that throws or returns nothing falls back to the snapshot
      const res2 = await CMA.engineRpc.run(SESSION, await buildPlan(fake, 'banana'), Object.assign({}, ENGINE_OPTS, { sessionProvider: () => { throw new Error('x'); } }));
      eq(res2.added.length, 1); eq(seen[seen.length - 1], 'NONCE');
      const searched = [];
      const origSearch = fake.rpc.searchFoods;
      fake.rpc.searchFoods = async (session, q, o) => { searched.push(session.nonce); return origSearch(session, q, o); };
      await CMA.plan.build(SESSION, CMA.parse.lines('banana'), Object.assign({}, FAST, { sessionProvider: () => Object.assign({}, SESSION, { nonce: 'BUILD' }) }));
      deepEq(searched, ['BUILD']);
    });
    it('//EX-style errors (plain Error) are NOT retried; batch continues', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [new Error('ErrorEntryChangeResult: Food not found')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.failed.length, 1); ok(/Food not found/.test(res.failed[0].error));
      eq(res.added.length, 1);
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 2);
    });

    it('stops on CMA.errors.Session; later rows are not attempted', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [null, new CMA.errors.Session('authentication failed')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.stopped, 'session');
      eq(res.added.length, 1);
      eq(res.failed.length, 1); eq(res.failed[0].kind, 'session');
      eq(res.skipped.length, 1); ok(/session/.test(res.skipped[0].reason));
      eq(fake.calls.filter(c => c.method === 'updateDiaryAdd').length, 2);
      deepEq(res.lastBatch.servingIds, ['SID1']);
    });

    it('throttled: backs off, retries only when status 429', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana');
      fake.calls.length = 0;
      fake.failScript.updateDiaryAdd = [new CMA.errors.Throttled('429', { status: 429 }), null, new CMA.errors.Throttled('version changed')];
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      eq(res.added.length, 1); eq(res.added[0].row.index, 0);
      eq(res.failed.length, 1); eq(res.failed[0].kind, 'throttled');
      const calls = fake.calls.filter(c => c.method === 'updateDiaryAdd');
      eq(calls.length, 3);
      ok(calls[1].t - calls[0].t >= 55, 'throttle backoff ' + (calls[1].t - calls[0].t));
    });

    it('cancellation via opts.isCancelled', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      let n = 0;
      const res = await CMA.engineRpc.run(SESSION, plan, Object.assign({}, ENGINE_OPTS, { isCancelled: () => ++n > 2 }));
      eq(res.stopped, 'cancelled');
      eq(res.added.length, 2);
      eq(res.skipped.length, 1);
    });

    it('accepts a bare rows array as the plan', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana');
      const res = await CMA.engineRpc.run(SESSION, plan.rows, Object.assign({}, ENGINE_OPTS, { date: DATE }));
      eq(res.added.length, 1);
    });

    it('undo calls removeServing for each id, sequentially, and clears lastBatch', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      fake.calls.length = 0;
      const u = await CMA.engineRpc.undo(SESSION, res.lastBatch, { delayMs: 30, refresh: false });
      deepEq(u.removed, ['SID1', 'SID2', 'SID3']);
      eq(u.failed.length, 0);
      const calls = fake.calls.filter(c => c.method === 'removeServing');
      deepEq(calls.map(c => c.args[0]), ['SID1', 'SID2', 'SID3']);
      ok(calls[1].t - calls[0].t >= 25 && calls[2].t - calls[1].t >= 25, 'sequential with delay');
      eq(CMA.engineRpc.lastBatch, null);
    });

    it('undo keeps the ids that failed to remove and stops on session errors', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      fake.failScript.removeServing = [new Error('nope')];
      let u = await CMA.engineRpc.undo(SESSION, res.lastBatch, { delayMs: 1, refresh: false });
      deepEq(u.removed, ['SID2', 'SID3']);
      deepEq(u.failed.map(f => f.id), ['SID1']);
      deepEq(CMA.engineRpc.lastBatch.servingIds, ['SID1']);
      fake.failScript.removeServing = [new CMA.errors.Session()];
      const res2 = await CMA.engineRpc.run(SESSION, await buildPlan(fake, 'banana\nbanana'), ENGINE_OPTS);
      u = await CMA.engineRpc.undo(SESSION, res2.lastBatch, { delayMs: 1, refresh: false });
      eq(u.stopped, 'session'); eq(u.removed.length, 0); eq(u.failed.length, 2);
      await CMA.engineRpc.clearLastBatch();
    });

    it('undo forgets ids the server rejected (kind rpc/rejected/http) but keeps network failures', async () => {
      const fake = makeFake();
      const plan = await buildPlan(fake, 'banana\nbanana\nbanana');
      const res = await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
      const gone = new Error('IllegalArgumentException: no such serving (from removeServing)'); gone.kind = 'rpc';
      fake.failScript.removeServing = [gone, new CMA.errors.Network('offline')];
      const u = await CMA.engineRpc.undo(SESSION, res.lastBatch, { delayMs: 1, refresh: false });
      deepEq(u.removed, ['SID3']);
      deepEq(u.failed.map(f => f.id + ':' + f.kind), ['SID1:rpc', 'SID2:network']);
      deepEq(u.dropped, ['SID1']);
      deepEq(CMA.engineRpc.lastBatch.servingIds, ['SID2'], 'only the network failure is kept for a retry');
      eq(CMA.engineRpc.lastBatch.userId, 1234567);
      fake.failScript.removeServing = [gone];
      const u2 = await CMA.engineRpc.undo(SESSION, CMA.engineRpc.lastBatch, { delayMs: 1, refresh: false });
      deepEq(u2.dropped, ['SID2']);
      eq(CMA.engineRpc.lastBatch, null, 'nothing left: batch cleared');
    });
    it('lastBatch persists through chrome.storage.local when available (stubbed)', async () => {
      const store = {};
      let installed = false;
      try {
        window.chrome = { storage: { local: {
          set(obj, cb) { Object.assign(store, obj); if (cb) cb(); },
          get(key, cb) { cb({ [key]: store[key] }); }
        } } };
        installed = typeof chrome !== 'undefined' && !!chrome.storage;
      } catch (e) { installed = false; }
      if (!installed) { ok(true, 'chrome not stubbable here'); return; }
      try {
        const fake = makeFake();
        const plan = await buildPlan(fake, 'banana\nbanana');
        await CMA.engineRpc.run(SESSION, plan, ENGINE_OPTS);
        const saved = store[CMA.engineRpc.STORAGE_KEY];
        ok(saved, 'saved');
        deepEq(saved.servingIds, ['SID1', 'SID2']);
        deepEq(saved.date, DATE);
        ok(JSON.stringify(saved).indexOf('NONCE') < 0, 'no session data persisted');
        CMA.engineRpc.lastBatch = null;
        const loaded = await CMA.engineRpc.loadLastBatch();
        deepEq(loaded.servingIds, ['SID1', 'SID2']);
        await CMA.engineRpc.clearLastBatch();
        eq(store[CMA.engineRpc.STORAGE_KEY], null);
      } finally {
        try { delete window.chrome; } catch (e) { window.chrome = undefined; }
      }
    });
  });

  describe('engineRpc.refreshDiary', () => {
    it('falls back to a hash flip when the nav elements are absent', async () => {
      const r = await CMA.engineRpc.refreshDiary({ waitMs: 10, hashWaitMs: 5 });
      eq(r.method, 'hash');
      eq(r.verified, false);
      eq(location.hash, '#diary');
    });
    it('clicks previous then next when the nav elements exist', async () => {
      const nav = document.createElement('div');
      nav.innerHTML = '<span class="diary-date-nav"><i class="diary-date-previous" style="display:inline-block;width:10px;height:10px"></i><i class="diary-date-next" style="display:inline-block;width:10px;height:10px"></i></span>';
      document.body.appendChild(nav);
      const clicks = [];
      nav.querySelector('.diary-date-previous').addEventListener('click', () => clicks.push('prev'));
      nav.querySelector('.diary-date-next').addEventListener('click', () => clicks.push('next'));
      try {
        location.hash = '#foods';
        const r = await CMA.engineRpc.refreshDiary({ waitMs: 10, hashWaitMs: 5 });
        eq(r.method, 'nav'); eq(r.clicks, 2);
        deepEq(clicks, ['prev', 'next']);
        // no capture here, so the clicks could not be verified: the hash flip runs as well and lands on #diary
        eq(r.hashFlip, true); eq(r.verified, false);
        eq(location.hash, '#diary', 'always back to #diary (the entries went to the diary), never to the previous non-diary hash');
      } finally { nav.remove(); }
    });
    it('reports verified=true when the capture state shows a new getDayInfo for the date (then no hash flip); prefers the visible nav inside .diary-panel', async () => {
      const nav = document.createElement('div');
      // icon-font <i>s render a glyph on the real page; give them a box here so isVisible() sees one
      const ico = 'style="display:inline-block;width:10px;height:10px"';
      nav.innerHTML = '<span class="other"><i class="diary-date-previous" ' + ico + '></i><i class="diary-date-next" ' + ico + '></i></span>'
        + '<div class="diary-panel"><i class="diary-date-previous" ' + ico + '></i><i class="diary-date-next" ' + ico + '></i></div>';
      document.body.appendChild(nav);
      CMA.capture = { state: { lastRpcAt: 1, rpcCount: 1, diaryDate: DATE } };
      const clicks = [];
      nav.querySelectorAll('.other i').forEach(i => i.addEventListener('click', () => clicks.push('other')));
      nav.querySelector('.diary-panel .diary-date-next').addEventListener('click', () => { clicks.push('panel-next'); CMA.capture.state.rpcCount++; CMA.capture.state.lastRpcAt = Date.now(); });
      nav.querySelector('.diary-panel .diary-date-previous').addEventListener('click', () => clicks.push('panel-prev'));
      try {
        const r = await CMA.engineRpc.refreshDiary({ waitMs: 10, date: DATE });
        eq(r.verified, true); eq(r.hashFlip, undefined, 'verified clicks: no hash flip');
        deepEq(clicks, ['panel-prev', 'panel-next'], 'the .diary-panel nav was clicked, not the other one');
        const r2 = await CMA.engineRpc.refreshDiary({ waitMs: 10, hashWaitMs: 5, date: { day: 1, month: 1, year: 2020 } });
        eq(r2.verified, false); eq(r2.hashFlip, true, 'unverified clicks fall through to the hash flip');
      } finally { nav.remove(); delete CMA.capture; }
    });
  });

  CMA.test.run();
})();
</script>
