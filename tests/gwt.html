<!doctype html>
<html>
<head><meta charset="utf-8"><title>gwt-stream tests</title></head>
<body>
<pre id="results"></pre>
<script src="lib.js"></script>
<script src="../src/lib/gwt-registry.js"></script>
<script src="../src/lib/gwt-stream.js"></script>
<script src="fixtures.js"></script>
<script>
(function () {
  'use strict';
  const T = CMA.test, G = CMA.gwt, FX = CMA.fixtures, REG = CMA.registry, S = CMA.fixtures.SIG;
  const eq = T.eq, ok = T.ok, deepEq = T.deepEq;
  const MB = FX.moduleBase;
  const UD_SIGS = [G.STRING_SIG, 'I', 'java.util.List'];
  function writer() { return new G.Writer(MB, 'POLICY'); }
  function fixedServing(extra) {
    return FX.serving(Object.assign({ day: FX.day(4, 3, 2026), order: 65537, grams: 50, foodId: 464674, measureId: 1072101, translationId: 0 }, extra || {}));
  }
  /** encodeResponse -> readResponse */
  function rt(value, kind) { return G.readResponse(G.encodeResponse(value, kind ? { kind } : undefined), kind).value; }

  // ------------------------------------------------------------------------------------------------
  T.describe('registry (generated by tools/gen_registry.py)', () => {
    T.it('metadata: permutation, policy hashes, generatedAt, no unknown types', () => {
      ok(/^[0-9A-F]{32}$/.test(REG.permutation), 'permutation');
      ok(/^[0-9A-F]{32}$/.test(REG.policyHash), 'policyHash');
      ok(/^[0-9A-F]{32}$/.test(REG.proPolicyHash), 'proPolicyHash');
      ok(/^\d{4}-\d{2}-\d{2}T/.test(REG.generatedAt), 'generatedAt is an ISO timestamp');
      ok(Object.keys(REG.types).length > 500, 'has > 500 types');
      eq(REG.stats.unknown, 0);
      eq(Object.values(REG.types).filter((e) => e.k === 'unknown').length, 0);
    });
    T.it('derived reader/writer method maps cover every kind', () => {
      const rk = new Set(Object.values(REG.readerMethods));
      ['i', 'z', 's', 'o', 'd', 'l', 'b', 'h'].forEach((k) => ok(rk.has(k), 'reader kind ' + k));
      const wk = new Set(Object.values(REG.writerMethods));
      ['i', 'z', 's', 'o', 'd', 'l', 'b', 'h'].forEach((k) => ok(wk.has(k), 'writer kind ' + k));
      ok(REG.readerHelpers.readObject, 'readObject impl recorded');
    });
    T.it('CronometerService method names were found', () => {
      ['updateDiary', 'getDayInfo', 'getFood', 'removeServing', 'authenticate', 'editDiaryEntries', 'reauthenticate']
        .forEach((m) => ok(REG.serviceMethods.includes(m), m));
      ok(REG.serviceMethods.length > 150, 'count ' + REG.serviceMethods.length);
    });
    T.it('Serving layout', () => deepEq(REG.types[S.SERVING].f, ['o', 'z', 'z', 'o', 'i', 'o', 'i', 'd', 'i', 'l', 'i', 'i', 'i']));
    T.it('Day / Time layouts', () => { deepEq(REG.types[S.DAY].f, ['b', 'b', 'h']); deepEq(REG.types[S.TIME].f, ['b', 'b', 'b']); });
    T.it('AddEntryChange (serializer-only) / AddEntryChangeResult / ErrorEntryChangeResult', () => {
      deepEq(REG.types[S.AEC].f, ['z', 'z', 'o']);
      eq(REG.types[S.AEC].from, 'ser');
      deepEq(REG.types[S.AECR].f, ['o']);
      deepEq(REG.types[S.EECR].f, ['o', 'o']);
    });
    T.it('DayInfo layout', () => deepEq(REG.types[S.DAYINFO].f, ['z', 'o', 'o', 'o', 'z', 's']));
    T.it('Measure / FoodMeasures layouts', () => {
      deepEq(REG.types[S.MEASURE].f, ['d', 'z', 'i', 'z', 'i', 'o', 's', 'o', 'o', 'd']);
      deepEq(REG.types[S.FOOD_MEASURES].f, ['i', 'o']);
    });
    T.it('Food: 20 fields, name idx 4, id idx 7, measures idx 11, translations idx 17', () => {
      const f = REG.types[S.FOOD].f;
      eq(f.length, 20);
      eq(f[4], 's'); eq(f[7], 'i'); eq(f[11], 'o'); eq(f[17], 'o');
      deepEq(f, ['i', 'z', 'o', 'i', 's', 'i', 'i', 'i', 'o', 'o', 'l', 'o', 'o', 'o', 'z', 's', 'o', 'o', 'o', 'i']);
    });
    T.it('SearchHit layout', () => deepEq(REG.types[S.SEARCH_HIT].f, ['i', 'i', 'i', 's', 's', 'i', 's', 'z', 'i', 'o', 's', 'i', 'o', 'i']));
    T.it('User: 42 fields, idx 19 int (userId), idx 33 string (session key)', () => {
      const f = REG.types[S.USER].f;
      eq(f.length, 42); eq(f[19], 'i'); eq(f[33], 's');
      eq(f.join(''), FX.USER_KINDS);
    });
    T.it('collections, arrays, enums, boxes, exceptions', () => {
      eq(REG.types[S.HASHMAP].k, 'map');
      eq(REG.types[S.SINGLETON].k, 'singleton');
      deepEq(REG.types[S.STRING_ARRAY], { e: 's', k: 'array' });
      eq(REG.types[S.MEASURE_TYPE].k, 'enum');
      eq(REG.types[S.FOOD_SOURCE].k, 'enum');
      eq(REG.types[S.ARRAYLIST].k, 'list');
      eq(REG.types[S.USER_PREFS].k, 'map', 'UserPreferences extends HashMap');
      deepEq(REG.types[S.NOT_LOGGED_IN].f, ['s']);
      deepEq(REG.types[S.STRING], { k: 'box', t: 's' });
      deepEq(REG.types[S.INTEGER], { k: 'box', t: 'i' });
      deepEq(REG.types['java.util.TreeMap/1493889780'], { k: 'map', pre: ['o'] });
      deepEq(REG.types['java.util.LinkedHashMap/3008245022'], { k: 'map', pre: ['z'] });
      deepEq(REG.types['java.util.Date/3385151746'], { k: 'date' });
      deepEq(REG.types['[I/2970817851'], { e: 'i', k: 'array' });
      deepEq(REG.types['[D/2047612875'], { e: 'd', k: 'array' });
    });
    T.it('sig() resolves base names and F/SIG constants match the spec', async () => {
      eq(G.sig('java.util.ArrayList'), S.ARRAYLIST);
      eq(G.SIG.SERVING, S.SERVING);
      eq(G.SIG.USER_PREFERENCES, S.USER_PREFS);
      eq(G.boxSig('i'), S.INTEGER);
      await T.throws(() => G.sig('no.such.Type'), /no type signature/);
      deepEq(G.F, { SERVING: { DAY: 0, ORDER: 4, TIME: 5, USER: 6, GRAMS: 7, FOOD: 8, ID: 9, MEASURE: 10, TRANSLATION: 12 },
        MEASURE: { AMOUNT: 0, FOOD: 2, HIDDEN: 3, ID: 4, ML: 5, NAME: 6, TYPE: 8, GRAMS: 9 }, FOOD: { NAME: 4, ID: 7, MEASURES: 11, TRANSLATIONS: 17 },
        DAYINFO: { LIST1: 2, LIST2: 3 }, USER: { ID: 19, SESSION: 33 } });
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('longs (T0n/Q0n base64)', () => {
    T.it('0 -> A, alphabet order A-Z a-z 0-9 $ _', () => {
      eq(G.encodeLong(0), 'A'); eq(G.encodeLong(1), 'B'); eq(G.encodeLong(25), 'Z'); eq(G.encodeLong(26), 'a');
      eq(G.encodeLong(51), 'z'); eq(G.encodeLong(52), '0'); eq(G.encodeLong(61), '9'); eq(G.encodeLong(62), '$');
      eq(G.encodeLong(63), '_'); eq(G.encodeLong(64), 'BA'); eq(G.encodeLong(4096), 'BAA');
    });
    T.it('captured serving ids', () => {
      eq(G.decodeLong('D80lp$'), 4241644158);
      eq(G.encodeLong(4241644158), 'D80lp$');
      eq(G.encodeLong(G.decodeLong('D9zN$G')), 'D9zN$G');
      eq(G.decodeLong('A'), 0);
    });
    T.it('accepts plain numbers and BigInts', () => {
      eq(G.decodeLong(5), 5); eq(G.decodeLong(-7), -7); eq(G.decodeLong(12n), 12);
      eq(G.decodeLongBig('A'), 0n); eq(G.decodeLongBig(3), 3n);
    });
    T.it('round trips incl. > 2^31 and negative values', () => {
      [1, 63, 64, 4095, 4096, 2147483647, 2147483648, 4294967295, 4294967296, Math.pow(2, 40) + 3, Number.MAX_SAFE_INTEGER,
        -1, -2, -63, -64, -65, -2147483648, -2147483649, -4294967296, -Math.pow(2, 52), Number.MIN_SAFE_INTEGER]
        .forEach((v) => eq(G.decodeLong(G.encodeLong(v)), v, 'value ' + v));
      eq(G.encodeLong(-1), 'P__________', '-1 fills all eleven groups');
    });
    T.it('values beyond 2^53 come back as BigInt', () => {
      const big = (1n << 62n) + 12345n;
      const s = G.encodeLong(big);
      eq(typeof G.decodeLong(s), 'bigint');
      eq(G.decodeLong(s), big);
      eq(G.encodeLong(-(1n << 63n)), 'IAAAAAAAAAA');
      eq(G.decodeLong('IAAAAAAAAAA'), -(1n << 63n));
      eq(G.decodeLong(G.encodeLong((1n << 63n) - 1n)), (1n << 63n) - 1n);
    });
    T.it('matches the compiled T0n/Q0n algorithm (32-bit hi/lo formulation) on random 64-bit values', () => {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$_';
      function ref(hi, lo) {   // T0n verbatim: c = hi, d = lo (both int32); Q0n emits once a non-zero group was seen
        let out = '';
        function Q(g, c) { if (g > 0) c = true; if (c) out += alphabet[g]; return c; }
        let b = Q(hi >> 28 & 15, false); b = Q(hi >> 22 & 63, b); b = Q(hi >> 16 & 63, b); b = Q(hi >> 10 & 63, b); b = Q(hi >> 4 & 63, b);
        b = Q((hi & 15) << 2 | lo >> 30 & 3, b); b = Q(lo >> 24 & 63, b); b = Q(lo >> 18 & 63, b); b = Q(lo >> 12 & 63, b);
        Q(lo >> 6 & 63, b); Q(lo & 63, true);
        return out;
      }
      let x = 123456789;
      function rnd() { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x | 0; }
      for (let i = 0; i < 300; i++) {
        const hi = rnd(), lo = rnd();
        const v = BigInt.asIntN(64, (BigInt(hi) << 32n) | BigInt(lo >>> 0));
        const expect = ref(hi, lo);
        eq(G.encodeLong(v), expect, 'hi=' + hi + ' lo=' + lo);
        eq(G.decodeLongBig(expect), v, 'decode hi=' + hi + ' lo=' + lo);
      }
      for (let i = 0; i < 100; i++) {   // small positive values: zero high word
        const lo = rnd() >>> 1;
        eq(G.encodeLong(lo), ref(0, lo));
      }
      eq(G.encodeLong(5), ref(0, 5)); eq(G.encodeLong(-1), ref(-1, -1)); eq(G.encodeLong(0), ref(0, 0));
    });
    T.it('rejects invalid input', async () => {
      await T.throws(() => G.decodeLong('a-b'), /invalid/);
      await T.throws(() => G.decodeLong(''), /invalid/);
      await T.throws(() => G.decodeLong('AAAAAAAAAAAA'), /invalid/);
      await T.throws(() => G.encodeLong(1.5), /integer/);
      await T.throws(() => G.encodeLong('D80lp$'), /integer/);
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('string escaping (C1n)', () => {
    T.it('escapes | \\ NUL and non-BMP characters as \\! \\\\ \\0 \\uXXXX', () => {
      eq(G.escapeString('a|b'), 'a\\!b');
      eq(G.escapeString('a\\b'), 'a\\\\b');
      eq(G.escapeString('x\u0000y'), 'x\\0y');
      eq(G.escapeString('\u{1F600}'), '\\ud83d\\ude00');
      eq(G.escapeString('�'), '\\ufffd');
      eq(G.escapeString(''), '\\ue000');
    });
    T.it('leaves ASCII and Latin-1 alone', () => {
      eq(G.escapeString('café 100g, 1/2 cup!'), 'café 100g, 1/2 cup!');
      eq(G.escapeString('ÿ'), 'ÿ');
    });
    T.it('webkit class (what Chrome runs) also escapes combining marks; the default class does not', () => {
      eq(G.escapeString('α'), '\\u03b1');
      eq(G.escapeString('α', G.ESCAPE_RE_DEFAULT), 'α');
      eq(G.escapeString('\u{1F600}', G.ESCAPE_RE_DEFAULT), '\\ud83d\\ude00');
    });
    T.it('unescape inverts escape for both classes', () => {
      ['a|b', 'a\\b', 'x\u0000y', '\u{1F600}', 'café | 100g \\ α 😀 end', '\\u0041 literal', '||\\\\!!', '']
        .forEach((s) => {
          eq(G.unescapeString(G.escapeString(s)), s, JSON.stringify(s));
          eq(G.unescapeString(G.escapeString(s, G.ESCAPE_RE_DEFAULT)), s, JSON.stringify(s) + ' (default class)');
        });
      eq(G.unescapeString('\\!'), '|');
      eq(G.unescapeString('\\0'), '\u0000');
      eq(G.unescapeString('\\ud83d\\ude00'), '\u{1F600}');
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('Writer (request bodies)', () => {
    T.it('updateDiary body is byte-equal to the SPEC 4 template for the fixed inputs', () => {
      const body = writer().call('updateDiary', UD_SIGS,
        [{ s: 'NONCE' }, { i: 1234567 }, { $t: S.SINGLETON, f: [FX.addEntryChange(fixedServing())] }]);
      eq(body, FX.updateDiaryTemplate);
    });
    T.it('plain JS values are accepted for primitive parameters', () => {
      const body = writer().call('updateDiary', UD_SIGS, ['NONCE', 1234567, { $t: S.SINGLETON, f: [FX.addEntryChange(fixedServing())] }]);
      eq(body, FX.updateDiaryTemplate);
    });
    T.it('non-finite doubles never reach the wire (the client never produces NaN/Infinity from the dialog)', async () => {
      await T.throws(() => writer().call('m', ['D'], [NaN]), /finite/);
      await T.throws(() => writer().call('m', ['D'], [Infinity]), /finite/);
      const nanServing = fixedServing(); nanServing.f[G.F.SERVING.GRAMS] = NaN;   // (the fixture builder would default a NaN)
      await T.throws(() => writer().call('updateDiary', UD_SIGS, ['NONCE', 1234567, { $t: S.SINGLETON, f: [FX.addEntryChange(nanServing)] }]), /finite/);
      ok(/\|50\|/.test(writer().call('m', ['D'], [50])), 'a finite double is written as ""+x');
    });
    T.it('getDayInfo / getFood / removeServing / authenticate templates', () => {
      eq(writer().call('getDayInfo', [G.STRING_SIG, S.DAY, 'I'], ['NONCE', FX.day(4, 3, 2026), 1234567]), FX.getDayInfoTemplate);
      eq(writer().call('getFood', [G.STRING_SIG, 'I'], ['NONCE', 464674]), FX.getFoodTemplate);
      eq(writer().call('removeServing', [G.STRING_SIG, 'J', 'I'], ['NONCE', { l: 'D80lp$' }, 1234567]), FX.removeServingTemplate);
      eq(writer().call('removeServing', [G.STRING_SIG, 'J', 'I'], ['NONCE', 4241644158, 1234567]), FX.removeServingTemplate);
      eq(writer().call('authenticate', [S.INTEGER], [{ i: -300 }]), FX.authenticateTemplate);
    });
    T.it('SingletonList writes the element only; ArrayList writes a size first', () => {
      const single = G.parseRequest(writer().call('updateDiary', UD_SIGS, ['N', 1, { $t: S.SINGLETON, f: [FX.addEntryChange(fixedServing())] }]));
      const list = G.parseRequest(writer().call('updateDiary', UD_SIGS, ['N', 1, [FX.addEntryChange(fixedServing())]]));
      deepEq(single.tokens.slice(0, 4), ['8', '1', '9', '10']);          // nonce, userId, SingletonList, AddEntryChange
      deepEq(list.tokens.slice(0, 5), ['8', '1', '9', '1', '10']);       // nonce, userId, ArrayList, size, AddEntryChange
      eq(list.strings[8], S.ARRAYLIST);
      eq(single.strings[8], S.SINGLETON);
    });
    T.it('back-references: an object written twice becomes -(k+1) and decodes to the same object', () => {
      const d = FX.day(1, 2, 2030);
      const body = writer().call('m', ['java.util.List'], [[d, d]]);
      const p = G.parseRequest(body);
      deepEq(p.tokens, ['6', '2', '7', '1', '2', '2030', '-2']);   // ArrayList=obj0, Day=obj1, back-ref to obj1
      ok(p.params[0][0] === p.params[0][1], 'identity restored');
      const two = FX.serving({ day: d, time: FX.time(8, 0, 0) });
      const p2 = G.parseRequest(writer().call('m', ['java.util.List'], [[two, two, d]]));
      eq(p2.params[0].length, 3);
      ok(p2.params[0][0] === p2.params[0][1]);
      ok(p2.params[0][0].f[0] === p2.params[0][2], 'Day inside the Serving and the list element are one object');
    });
    T.it('JS strings in object slots become java.lang.String objects and back-reference by value', () => {
      const p = G.parseRequest(writer().call('m', ['java.util.List'], [['ab', 'ab', 'cd']]));
      deepEq(p.tokens, ['6', '3', '7', '8', '-2', '7', '9']);
      eq(p.strings[6], S.STRING);
      deepEq(p.params[0], ['ab', 'ab', 'cd']);
    });
    T.it('tagged primitives box; bare numbers in object slots are rejected', async () => {
      const p = G.parseRequest(writer().call('m', ['java.util.List'], [[{ i: 5 }, { d: 1.5 }, { z: true }, { l: 7 }, { h: 3 }, null, true]]));
      deepEq(p.params[0], [5, 1.5, true, 'H', 3, null, true]);
      await T.throws(() => writer().call('m', ['java.util.List'], [[5]]), /ambiguous/);
    });
    T.it('Map -> HashMap with String keys/values; wrapped map types with pre-reads', () => {
      const m = new Map([['DG01', 'Breakfast'], ['DG01ON', 'true']]);
      const p = G.parseRequest(writer().call('m', ['java.util.Map'], [m]));
      eq(p.strings[5], S.HASHMAP);
      deepEq(p.tokens, ['6', '2', '7', '8', '7', '9', '7', '10', '7', '11']);
      ok(p.params[0] instanceof Map);
      eq(p.params[0].get('DG01ON'), 'true');
      const tm = G.parseRequest(writer().call('m', ['java.util.Map'], [{ $t: G.sig('java.util.TreeMap'), m }]));
      deepEq(tm.tokens.slice(0, 3), ['6', '0', '2']);     // TreeMap, comparator null, size
      const lhm = G.parseRequest(writer().call('m', ['java.util.Map'], [{ $t: G.sig('java.util.LinkedHashMap'), m, pre: [true] }]));
      deepEq(lhm.tokens.slice(0, 3), ['6', '1', '2']);    // LinkedHashMap, accessOrder true, size
    });
    T.it('booleans travel as 1/0 and come back as booleans', () => {
      const p = G.parseRequest(writer().call('updateDiary', UD_SIGS, ['N', 1, [FX.addEntryChange(fixedServing({ b: false, c: true }))]]));
      const s = p.params[2][0].f[2];
      eq(s.f[1], false); eq(s.f[2], true);
      eq(p.tokens.indexOf('0') >= 0, true);
    });
    T.it('escapes strings in the table and parseRequest unescapes them', () => {
      const raw = 'a|b\\c\u{1F600}\u0000';
      const body = writer().call('m', [G.STRING_SIG], [raw]);
      ok(body.indexOf('|a\\!b\\\\c\\ud83d\\ude00\\0|') >= 0, body);
      eq(G.parseRequest(body).params[0], raw);
      eq(G.parseRequest(body).nonce, raw);
    });
    T.it('validates parameters, field counts and type signatures', async () => {
      await T.throws(() => writer().call('m', ['java.util.List'], [[{ $t: S.DAY, f: [1, 2] }]]), /expects 3 fields/);
      await T.throws(() => writer().call('m', ['I'], ['x']), /integer/);
      await T.throws(() => writer().call('m', ['I', 'I'], [1]), /expects 2 values/);
      await T.throws(() => writer().call('m', ['java.util.List'], [[{ $t: 'no.such.Type/1', f: [] }]]), /unknown type signature/);
      await T.throws(() => writer().call('m', ['J'], ['not base64!']), /base64/);
      await T.throws(() => new G.Writer('', 'P'), /module base/);
    });
    T.it('service can be overridden', () => {
      const p = G.parseRequest(new G.Writer(MB, 'P', { service: 'com.cronometer.shared.rpc.ProService' }).call('x', [], []));
      eq(p.service, 'com.cronometer.shared.rpc.ProService');
      eq(p.policyHash, 'P'); eq(p.moduleBase, MB); eq(p.method, 'x'); deepEq(p.paramSigs, []);
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('Writer -> Reader round trips (encodeResponse / readResponse)', () => {
    T.it('Serving with Day and Time, long id', () => {
      const s = FX.serving({ day: FX.day(4, 3, 2026), time: FX.time(12, 30, 0), order: 65537, grams: 50.5, foodId: 464674,
        measureId: 1072101, id: 4241644158, userId: 7, translationId: 409412, offset: { h: 2 } });
      const r = rt(s);
      eq(r.$t, S.SERVING);
      deepEq(r.f[0], FX.day(4, 3, 2026));
      deepEq(r.f[5], FX.time(12, 30, 0));
      eq(r.f[3], 2, 'boxed Short offset');
      eq(r.f[9], 'D80lp$'); eq(r.f[7], 50.5); eq(r.f[4], 65537); eq(r.f[6], 7); eq(r.f[12], 409412);
      eq(r.f.length, 13);
    });
    T.it('AddEntryChange in SingletonList vs ArrayList, with back-references', () => {
      const aec = FX.addEntryChange(fixedServing({ id: 'A' }));
      const one = rt({ $t: S.SINGLETON, f: [aec] });
      ok(Array.isArray(one)); eq(one.length, 1); deepEq(one[0], aec);
      const two = rt([aec, aec]);
      eq(two.length, 2); ok(two[0] === two[1], 'back-reference resolved to the same object'); deepEq(two[0], aec);
    });
    T.it('Measure with enum type, String object, boxed Integer and null', () => {
      const m = FX.measure({ foodId: 464674, id: 1072101, name: 'g', type: 0, grams: 1, f: 'unit string', i: { i: 12 } });
      const r = rt(m);
      eq(r.f[6], 'g'); deepEq(r.f[8], { $t: S.MEASURE_TYPE, ordinal: 0 }); eq(r.f[5], 'unit string'); eq(r.f[7], 12); eq(r.f[9], 1);
      eq(r.f[2], 464674); eq(r.f[4], 1072101);
      const n = rt(FX.measure({ type: null }));
      eq(n.f[8], null);
    });
    T.it('Food with FoodMeasures, translations and enums', () => {
      const food = FX.food({ id: 464674, name: 'Chicken breast', category: 3, defaultMeasureId: 1072101, source: 'USDA', type: 1,
        measures: [FX.measure({ foodId: 464674, id: 1072101, name: 'g', type: 0, grams: 1 }), FX.measure({ foodId: 464674, id: 5, name: 'cup, diced', type: 1, grams: 140 })],
        translations: [FX.translation('Poulet', 409412)] });
      const r = rt(food);
      eq(r.f.length, 20);
      eq(r.f[G.F.FOOD.NAME], 'Chicken breast'); eq(r.f[G.F.FOOD.ID], 464674); eq(r.f[3], 3); eq(r.f[15], 'USDA');
      eq(r.f[G.F.FOOD.MEASURES].$t, S.FOOD_MEASURES);
      eq(r.f[G.F.FOOD.MEASURES].f[0], 1072101);
      eq(r.f[G.F.FOOD.MEASURES].f[1].length, 2);
      eq(r.f[G.F.FOOD.MEASURES].f[1][1].f[G.F.MEASURE.NAME], 'cup, diced');
      eq(r.f[G.F.FOOD.MEASURES].f[1][1].f[G.F.MEASURE.GRAMS], 140);
      eq(r.f[G.F.FOOD.TRANSLATIONS][0].f[1], 'Poulet');
      deepEq(r.f[18], { $t: S.FOOD_TYPE, ordinal: 1 });
      deepEq(r, food);
    });
    T.it('User (42 fields) with the UserPreferences map', () => {
      const u = FX.user({ userId: 1234567, session: 'SESSIONKEY', groups: [{ id: 0, name: 'Uncategorized', enabled: false }, { id: 1, name: 'Breakfast', enabled: true }] });
      const r = rt(u);
      eq(r.f.length, 42); eq(r.f[G.F.USER.ID], 1234567); eq(r.f[G.F.USER.SESSION], 'SESSIONKEY');
      ok(r.f[28] instanceof Map, 'UserPreferences decodes to a Map');
      const maps = G.findMaps(r, (m) => m.has('DG01'));
      eq(maps.length, 1);
      eq(maps[0].get('DG02'), 'Breakfast'); eq(maps[0].get('DG02ON'), 'true'); eq(maps[0].get('DG01ON'), 'false'); eq(maps[0].get('DG_ON'), 'true');
    });
    T.it('maps with string keys/values; TreeMap / LinkedHashMap / EnumMap pre-reads', () => {
      const m = new Map([['k1', 'v1'], ['k2', 'v2']]);
      const r = rt(m);
      ok(r instanceof Map); eq(r.size, 2); eq(r.get('k1'), 'v1'); eq(r.get('k2'), 'v2');
      const tm = rt({ $t: G.sig('java.util.TreeMap'), m });
      eq(tm.get('k2'), 'v2'); deepEq(tm.$pre, [null]);
      const lhm = rt({ $t: G.sig('java.util.LinkedHashMap'), m, pre: [true] });
      deepEq(lhm.$pre, [true]); eq(lhm.size, 2);
      const em = rt({ $t: G.sig('java.util.EnumMap'), m: new Map([[{ $t: S.MEASURE_TYPE, ordinal: 2 }, 'x']]) });
      eq(em.size, 1); deepEq([...em.keys()][0], { $t: S.MEASURE_TYPE, ordinal: 2 }); eq([...em.values()][0], 'x');
      const nested = rt(new Map([['inner', new Map([['a', { i: 1 }]])]]));
      eq(nested.get('inner').get('a'), 1);
    });
    T.it('enums, dates, arrays, empty collections, boxes, null', () => {
      deepEq(rt({ $t: S.FOOD_SOURCE, ordinal: 3 }), { $t: S.FOOD_SOURCE, ordinal: 3 });
      const d = rt({ $t: G.sig('java.util.Date'), ms: 1700000000000 });
      eq(d.ms, 1700000000000); eq(d.$t, G.sig('java.util.Date'));
      deepEq(rt({ $t: S.STRING_ARRAY, f: ['a', null, 'c'] }), ['a', null, 'c']);
      deepEq(rt({ $t: '[I/2970817851', f: [1, 2, 3] }), [1, 2, 3]);
      deepEq(rt({ $t: '[D/2047612875', f: [1.5, 2] }), [1.5, 2]);
      deepEq(rt({ $t: G.sig('java.util.Collections$EmptyList') }), []);
      ok(rt({ $t: G.sig('java.util.Collections$EmptyMap') }) instanceof Map);
      deepEq(rt({ $t: G.sig('java.util.HashSet'), f: ['x', 'y'] }), ['x', 'y']);
      deepEq(rt({ $t: G.sig('java.util.Arrays$ArrayList'), f: [{ i: 1 }] }), [1]);
      eq(rt({ i: 42 }), 42); eq(rt('str'), 'str'); eq(rt(true), true); eq(rt({ l: 4241644158 }), 'D80lp$'); eq(rt({ d: 2.5 }), 2.5);
      eq(rt(null), null);
      eq(rt(undefined), null, 'void');
      eq(G.encodeResponse(undefined), '//OK[[],0,7]');
      eq(G.encodeResponse(null), '//OK[0,[],0,7]');
    });
    T.it('primitive response kinds', () => {
      eq(rt('abc', 's'), 'abc'); eq(rt(12, 'i'), 12); eq(rt(true, 'z'), true); eq(rt(false, 'z'), false);
      eq(rt(1.25, 'd'), 1.25); eq(rt(9, 'l'), 'J'); eq(G.readResponse('//OK[[],0,7]', 'v').value, null);
    });
    T.it('Writer -> parseRequest reproduces the graph (longs as base64 strings)', () => {
      const s = fixedServing({ id: 'A' });
      const p = G.parseRequest(writer().call('updateDiary', UD_SIGS, ['NONCE', 1234567, { $t: S.SINGLETON, f: [FX.addEntryChange(s)] }]));
      eq(p.paramError, null);
      eq(p.params[2].length, 1);
      deepEq(p.params[2][0], FX.addEntryChange(s));
      const big = fixedServing({ id: 4241644158 });
      const p2 = G.parseRequest(writer().call('updateDiary', UD_SIGS, ['NONCE', 1234567, [FX.addEntryChange(big)]]));
      eq(p2.params[2][0].f[2].f[9], 'D80lp$');
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('real captured responses', () => {
    T.it('updateDiary response decodes field by field', () => {
      const r = G.readResponse(FX.updateDiaryResponse);
      ok(r.ok); eq(r.version, 7); eq(r.flags, 0); eq(r.remaining, 0);
      const list = r.value;
      ok(Array.isArray(list)); eq(list.length, 1);
      eq(list[0].$t, S.AECR);
      const s = list[0].f[0];
      eq(s.$t, S.SERVING);
      eq(s.f[G.F.SERVING.ID], 'D80lp$');
      eq(G.decodeLong(s.f[G.F.SERVING.ID]), 4241644158);
      eq(s.f[G.F.SERVING.FOOD], 464674);
      eq(s.f[G.F.SERVING.MEASURE], 1072101);
      eq(s.f[G.F.SERVING.GRAMS], 50);
      eq(s.f[G.F.SERVING.ORDER], 65541);
      eq(s.f[G.F.SERVING.USER], 1234567);
      deepEq(s.f[G.F.SERVING.DAY], FX.day(4, 3, 2026));
      eq(s.f[1], true); eq(s.f[2], true); eq(s.f[3], null); eq(s.f[G.F.SERVING.TIME], null); eq(s.f[11], 0); eq(s.f[G.F.SERVING.TRANSLATION], 0);
    });
    T.it('editDiaryEntries response decodes field by field', () => {
      const r = G.readResponse(FX.editDiaryEntriesResponse);
      ok(r.ok);
      eq(r.value.length, 1);
      const s = r.value[0];
      eq(s.$t, S.SERVING);
      // Wire order after grams is foodId, id, measureId (Poj: Ts(b.j) foodId, dt(b.k) id, Ts(b.n) measureId), so this
      // capture holds foodId 461776 and measureId 1055762 (SPEC 9 lists the two labels the other way round).
      eq(s.f[G.F.SERVING.TRANSLATION], 409412); eq(s.f[G.F.SERVING.FOOD], 461776); eq(s.f[G.F.SERVING.MEASURE], 1055762);
      eq(s.f[G.F.SERVING.GRAMS], 28); eq(s.f[G.F.SERVING.ORDER], 65540); eq(s.f[G.F.SERVING.ID], 'D9zN$G');
      eq(s.f[11], 0); eq(s.f[3], null); eq(s.f[G.F.SERVING.TIME], null); eq(s.f[1], true); eq(s.f[2], true);
      eq(s.f[G.F.SERVING.USER], 1234567);
      deepEq(s.f[G.F.SERVING.DAY], FX.day(8, 3, 2026));
    });
    T.it('//EX NotLoggedInException', () => {
      const r = G.readResponse(FX.notLoggedInResponse);
      eq(r.ok, false);
      ok(r.exception.type.indexOf('NotLoggedInException') >= 0, r.exception.type);
      eq(r.exception.message, 'authentication failed');
      eq(r.raw, FX.notLoggedInResponse);
      eq(r.exception.value.$t, S.NOT_LOGGED_IN);
    });
    T.it('//OK[[],0,7] is void -> value null', () => {
      const r = G.readResponse(FX.voidResponse);
      ok(r.ok); eq(r.value, null);
    });
    T.it('encodeResponse reproduces the captured updateDiary response (modulo 50 vs 50.0)', () => {
      const s = FX.serving({ day: FX.day(4, 3, 2026), order: 65541, userId: 1234567, grams: 50, foodId: 464674, id: 'D80lp$', measureId: 1072101 });
      const text = G.encodeResponse([FX.addEntryChangeResult(s)]);
      eq(text, FX.updateDiaryResponse.replace('50.0', '50'));
      deepEq(G.readResponse(text).value, G.readResponse(FX.updateDiaryResponse).value);
    });
    T.it('pre-version-8 literal payloads are parsed without eval', () => {
      eq(G.readResponse(FX.v7LiteralResponse, 's').value, 'café\u0000|');
      deepEq(G.parseArrayLiteral("[1,'a\\'b',\"c\\\"d\",[true,null,-2.5e1,.5],'\\u0041\\x42']"), [1, "a'b", 'c"d', [true, null, -25, 0.5], 'AB']);
    });
    T.it('malformed input throws with a clear message', async () => {
      await T.throws(() => G.readResponse('garbage'), /not a GWT-RPC/);
      await T.throws(() => G.readResponse('//OK[1,2'), /parse|malformed/);
      await T.throws(() => G.readResponse('//OK[1,2]'), /malformed/);
      await T.throws(() => G.readResponse('//OK[1,["no.such.Type/1"],0,7]'), /unknown type signature/);
      await T.throws(() => G.readResponse('//OK[[],1,7]'), /elided/);
      await T.throws(() => G.readResponse('//OK[[],0,9]'), /version/);
      await T.throws(() => G.readResponse('//OK[1,["java.util.ArrayList/4159755760"],0,7]'), /unexpected end/);
      await T.throws(() => G.readResponse('//OK[-1,[],0,7]'), /back-reference/);
      await T.throws(() => G.readResponse(null), /not a string/);
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('parseRequest', () => {
    T.it('updateDiary template: header, sigs, nonce, userId, Serving fields', () => {
      const p = G.parseRequest(FX.updateDiaryTemplate);
      eq(p.version, 7); eq(p.flags, 0); eq(p.strings.length, 12);
      eq(p.moduleBase, MB); eq(p.policyHash, 'POLICY'); eq(p.service, G.SERVICE); eq(p.method, 'updateDiary');
      deepEq(p.paramSigs, UD_SIGS);
      eq(p.nonce, 'NONCE'); eq(p.params[1], 1234567); eq(p.paramError, null);
      const list = p.params[2];
      eq(list.length, 1); eq(list[0].$t, S.AEC); eq(list[0].f[0], true);
      const s = list[0].f[2];
      eq(s.$t, S.SERVING);
      deepEq(s.f[G.F.SERVING.DAY], FX.day(4, 3, 2026));
      eq(s.f[G.F.SERVING.ORDER], 65537); eq(s.f[G.F.SERVING.GRAMS], 50); eq(s.f[G.F.SERVING.FOOD], 464674);
      eq(s.f[G.F.SERVING.ID], 'A'); eq(s.f[G.F.SERVING.MEASURE], 1072101); eq(s.f[G.F.SERVING.USER], 0);
      deepEq(p.tokens.slice(0, 2), ['8', '1234567']);
      const sp = G.simpleParams(p);
      eq(sp[0].kind, 'string'); eq(sp[0].value, 'NONCE');
      eq(sp[1].kind, 'int'); eq(sp[1].value, 1234567); eq(sp[1].simple, true);
      eq(sp[2].simple, false); eq(sp[2].kind, 'object');
    });
    T.it('getDayInfo template: Day param flattened, userId after it', () => {
      const p = G.parseRequest(FX.getDayInfoTemplate);
      eq(p.method, 'getDayInfo'); eq(p.nonce, 'NONCE');
      deepEq(p.params[1], FX.day(4, 3, 2026)); eq(p.params[2], 1234567);
      const sp = G.simpleParams(p);
      eq(sp[1].kind, 'day'); deepEq(sp[1].value, { day: 4, month: 3, year: 2026 });
      eq(sp[2].kind, 'int'); eq(sp[2].value, 1234567);
      ok(sp.every((x) => x.simple));
    });
    T.it('removeServing / getFood / authenticate templates', () => {
      const p = G.parseRequest(FX.removeServingTemplate);
      eq(p.params[1], 'D80lp$'); eq(G.simpleParams(p)[1].kind, 'long'); eq(p.params[2], 1234567);
      const f = G.parseRequest(FX.getFoodTemplate);
      eq(f.method, 'getFood'); eq(f.params[1], 464674);
      const a = G.parseRequest(FX.authenticateTemplate);
      eq(a.method, 'authenticate'); eq(a.nonce, null, 'first param is an Integer, not the nonce'); eq(a.params[0], -300);
    });
    T.it('Time params flatten too; a null Day is still simple', () => {
      const body = writer().call('getServings', [G.STRING_SIG, 'I', S.DAY, S.DAY, S.TIME, S.TIME], ['N', 5, FX.day(1, 1, 2026), null, FX.time(7, 5, 0), null]);
      const sp = G.simpleParams(G.parseRequest(body));
      deepEq(sp.map((x) => x.kind), ['string', 'int', 'day', 'day', 'time', 'time']);
      deepEq(sp[4].value, { h: 7, m: 5, s: 0 }); eq(sp[3].value, null); eq(sp[5].value, null);
    });
    T.it('undecodable parameters are reported, not thrown', () => {
      const p = G.parseRequest('7|0|6|' + MB + '|P|svc|m|no.such.Type/1|x|1|2|3|4|1|5|5|');
      eq(p.method, 'm'); eq(p.params.length, 0); ok(/unknown type signature/.test(p.paramError), p.paramError);
    });
    T.it('malformed bodies throw', async () => {
      await T.throws(() => G.parseRequest('7|0|'), /malformed/);
      await T.throws(() => G.parseRequest(''), /malformed/);
      await T.throws(() => G.parseRequest(null), /not a string/);
      await T.throws(() => G.parseRequest('7|0|2|a|b|1|2|3|9|0|'), /string index/);
      await T.throws(() => G.parseRequest('7|0|x|a|b|1|2|3|9|0|'), /malformed/);
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('synthetic responses from the fixture builders', () => {
    T.it('authenticate: userId (field 19), session key (field 33) and the DG map', () => {
      const text = FX.authenticateResponse({ userId: 42, session: 'SESS', groups: [0, 1, 2, 3, 4].map((id) => ({ id, name: FX.DEFAULT_GROUPS[id], enabled: true })) });
      ok(text.startsWith('//OK['));
      const r = G.readResponse(text);
      ok(r.ok);
      eq(r.value.$t, S.USER); eq(r.value.f[19], 42); eq(r.value.f[33], 'SESS');
      const maps = G.findMaps(r.value, (m) => m.has('DG01'));
      eq(maps.length, 1);
      const m = maps[0];
      for (let i = 1; i <= 5; i++) { eq(m.get('DG0' + i), FX.DEFAULT_GROUPS[i - 1]); eq(m.get('DG0' + i + 'ON'), 'true'); }
      eq(m.has('DG06'), false); eq(m.get('DG_ON'), 'true');
    });
    T.it('DayInfo with servings in both lists', () => {
      const a = FX.serving({ order: (1 << 16) | 1, foodId: 1, id: 'D80lp$' });
      const b = FX.serving({ order: (1 << 16) | 2, foodId: 2, id: 'D9zN$G' });
      const c = FX.serving({ order: (3 << 16) | 7, foodId: 3, id: 5 });
      const r = G.readResponse(FX.dayInfoResponse({ day: FX.day(4, 3, 2026), list1: [a, b], list2: [c], f: 'note' }));
      eq(r.value.$t, S.DAYINFO);
      deepEq(r.value.f[1], FX.day(4, 3, 2026));
      eq(r.value.f[G.F.DAYINFO.LIST1].length, 2); eq(r.value.f[G.F.DAYINFO.LIST2].length, 1);
      eq(r.value.f[G.F.DAYINFO.LIST1][1].f[G.F.SERVING.ORDER], 65538);
      eq(r.value.f[G.F.DAYINFO.LIST2][0].f[G.F.SERVING.ORDER] >> 16, 3);
      eq(r.value.f[G.F.DAYINFO.LIST2][0].f[G.F.SERVING.ID], 'F');
      eq(r.value.f[5], 'note');
    });
    T.it('Food response and updateDiary ok/error responses', () => {
      const food = G.readResponse(FX.foodResponse({ id: 9, name: 'Oats', measures: [FX.measure({ id: 3, name: 'cup', type: 1, grams: 80 })], defaultMeasureId: 3 })).value;
      eq(food.f[G.F.FOOD.NAME], 'Oats'); eq(food.f[G.F.FOOD.MEASURES].f[1][0].f[G.F.MEASURE.GRAMS], 80);
      const okr = G.readResponse(FX.updateDiaryOkResponse([FX.serving({ id: 'D80lp$' })])).value;
      eq(okr[0].$t, S.AECR); eq(okr[0].f[0].f[G.F.SERVING.ID], 'D80lp$');
      const err = G.readResponse(FX.updateDiaryErrorResponse('bad measure', FX.serving({}))).value;
      eq(err[0].$t, S.EECR); eq(err[0].f[0].f[0], 'bad measure'); eq(err[0].f[1].$t, S.SERVING);
    });
    T.it('encodeException / notLoggedInEx', () => {
      const r = G.readResponse(G.encodeException('com.cronometer.shared.user.exceptions.NotLoggedInException', 'authentication failed'));
      eq(r.ok, false); eq(r.exception.message, 'authentication failed'); ok(r.exception.type.indexOf('NotLoggedInException') >= 0);
      eq(FX.notLoggedInEx(), FX.notLoggedInResponse.replace('[2,1,[', '[2,1,['));
      eq(G.readResponse(FX.notLoggedInEx()).exception.message, 'authentication failed');
      const npe = G.readResponse(G.encodeException('java.lang.NullPointerException', 'npe'));
      eq(npe.exception.message, 'npe');
    });
  });

  // ------------------------------------------------------------------------------------------------
  T.describe('graph helpers', () => {
    T.it('walk visits every node once and survives cycles', () => {
      const a = { $t: S.DAY, f: [1, 2, 3] };
      const list = [a, a, new Map([['k', a]])];
      let n = 0;
      G.walk(list, () => { n++; });
      eq(n, 7);
      const self = { $t: S.DAY, f: [] };
      self.f.push(self);
      let m = 0;
      G.walk(self, () => { m++; });
      eq(m, 1);
      const paths = [];
      G.walk({ $t: S.DAY, f: [new Map([['x', [7]]])] }, (node, path) => { paths.push(path.join('/')); });
      deepEq(paths, ['', '0', '0/key0', '0/x', '0/x/0']);
    });
    T.it('findMaps with and without predicate', () => {
      const g = [new Map([['a', 'b']]), { $t: S.DAY, f: [new Map([['DG01', 'x']])] }];
      eq(G.findMaps(g).length, 2);
      eq(G.findMaps(g, (m) => m.has('DG01')).length, 1);
      eq(G.findMaps(null).length, 0);
    });
  });

  CMA.test.run();
})();
</script>
